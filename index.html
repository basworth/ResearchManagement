  // ---------- Admin access requests ----------
  async function callAdminFn(payload) {
    const { data: sess } = await sb.auth.getSession();
    const tok = sess && sess.session && sess.session.access_token;
    if (!tok) throw new Error("Your session expired — sign out and back in.");
    const res = await fetch(SUPABASE_URL + "/functions/v1/admin-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok },
      body: JSON.stringify(payload)
    });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || out.error) throw new Error(out.error || ("Failed (" + res.status + ")"));
    return out;
  }
  const reqBtn = document.getElementById("admin-req-btn");
  if (reqBtn) reqBtn.onclick = async () => {
    const msgEl = document.getElementById("admin-req-msg");
    const say = (t, c) => { msgEl.textContent = t; msgEl.style.color = c; };
    if (!sb) { say("Not connected — try again shortly.", "var(--red)"); return; }
    reqBtn.disabled = true; reqBtn.textContent = "Sending…"; say("", "");
    try {
      const out = await callAdminFn({ action: "request", reason: (document.getElementById("admin-req-reason").value || "").trim() });
      say(out.message || "Request sent.", out.ok ? "var(--green)" : "var(--orange)");
      toast(out.message || "Request sent");
    } catch (e) {
      say(e.message || "Could not send the request.", "var(--red)");
    } finally {
      reqBtn.disabled = false; reqBtn.textContent = "Request admin access";
    }
  };
  const reqList = document.getElementById("admin-req-list");
  if (reqList && sb) {
    (async () => {
      try {
        // RLS lets admins read every request and everyone else only their own, so this needs no
        // filtering of its own.
        const { data, error } = await sb.from("admin_requests")
          .select("id, user_id, reason, status, requested_at")
          .eq("status", "pending").order("requested_at", { ascending: true });
        if (error) throw error;
        if (!data || !data.length) {
          reqList.innerHTML = `<div style="color:var(--text2);font-size:14px;padding:6px 0">No pending requests.</div>`;
          return;
        }
        reqList.innerHTML = data.map(r => {
          const who = profileFor(r.user_id);
          return `<div class="task-row" style="padding:9px 0;gap:8px;align-items:flex-start">
            <div style="flex:1;min-width:0">
              <div style="font-size:14.5px;font-weight:600">${esc((who && who.name) || (who && who.email) || "Someone")}</div>
              <div style="font-size:12px;color:var(--text2)">Asked ${fmtDate(String(r.requested_at).slice(0, 10))}${r.reason ? " · " + esc(r.reason) : ""}</div>
            </div>
            <button class="mini-btn" data-req-yes="${esc(r.id)}" style="margin-top:0;flex:0 0 auto">Approve</button>
            <button class="mini-btn" data-req-no="${esc(r.id)}" style="margin-top:0;flex:0 0 auto;color:var(--red)">Deny</button>
          </div>`;
        }).join("");
        const decide = async (id, approve) => {
          try {
            const out = await callAdminFn({ action: "decide", requestId: id, approve });
            toast(out.message || "Done");
            await pullAll();
            render();
          } catch (e) { toast(e.message || "Could not save that decision"); }
        };
        reqList.querySelectorAll("[data-req-yes]").forEach(b => b.onclick = () => decide(b.dataset.reqYes, true));
        reqList.querySelectorAll("[data-req-no]").forEach(b => b.onclick = () => decide(b.dataset.reqNo, false));
      } catch (e) {
        reqList.innerHTML = `<div style="color:var(--text2);font-size:13px;padding:6px 0">Couldn't load requests: ${esc(e.message || "unknown error")}</div>`;
      }
    })();
  }

  const inviteBtn = document.getElementById("invite-send");
  if (inviteBtn) inviteBtn.onclick = async () => {
    const input = document.getElementById("invite-email");
    const msgEl = document.getElementById("invite-msg");
    const say = (text, colour) => { msgEl.textContent = text; msgEl.style.color = colour; };
    const email = (input.value || "").trim();
    if (!email) { say("Enter an email address first.", "var(--red)"); return; }
    if (!sb) { say("Not connected — try again in a moment.", "var(--red)"); return; }
    inviteBtn.disabled = true; inviteBtn.textContent = "Sending…"; say("", "");
    try {
      // Send the caller's OWN access token. The function asks Supabase whose token it is and
      // checks that against its allowlist — it never takes our word for who we are.
      const { data: sess } = await sb.auth.getSession();
      const tokenValue = sess && sess.session && sess.session.access_token;
      if (!tokenValue) throw new Error("Your session expired — sign out and back in.");
      const res = await fetch(SUPABASE_URL + "/functions/v1/invite-user", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tokenValue },
        body: JSON.stringify({ email })
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.error) throw new Error(out.error || ("Invite failed (" + res.status + ")"));
      say(out.message || "Invite sent.", out.alreadyActive ? "var(--orange)" : "var(--green)");
      if (out.ok) input.value = "";
      toast(out.message || "Invite sent");
    } catch (e) {
      say(e.message || "Could not send the invite.", "var(--red)");
    } finally {
      inviteBtn.disabled = false; inviteBtn.textContent = "Invite";
    }
  };
  $main.querySelectorAll("[data-org-edit]").forEach(b => b.onclick = () => {
    if (!isAdmin()) { toast("Only admins can change the org chart"); return; }
    openOrgSheet(b.dataset.orgEdit);
  });
  const orgToggle = document.getElementById("org-perms-toggle");
  if (orgToggle) orgToggle.onchange = () => {
    if (!isAdmin()) { orgToggle.checked = !orgToggle.checked; return; }
    state.orgPermissions = orgToggle.checked;
    saveLocal(); pushRoster(); render();
    toast(state.orgPermissions
      ? "Org chart now controls who sees what — turn it off here if anything looks wrong"
      : "Back to the built-in admin list — nothing changed for anyone else");
  };
  $main.querySelectorAll("[data-roster-del]").forEach(b => b.onclick = () => {
    const gone = b.dataset.rosterDel;
    state.roster = state.roster.filter(x => x !== gone);
    saveLocal(); pushRoster(); render();
    toast(gone + " removed from the team list");
  });

  document.getElementById("export-btn").onclick = () => {
    const files = {};
    Object.keys(localStorage).filter(k => k.startsWith("rt-file-")).forEach(k => { files[k.slice(8)] = localStorage.getItem(k); });
    const blob = new Blob([JSON.stringify(Object.assign({}, state, { files }), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "research-tracker-backup-" + todayStr() + ".json";
    a.click();
    toast("Backup downloaded");
  };
  document.getElementById("import-btn").onclick = () => document.getElementById("import-file").click();
  document.getElementById("import-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.studies) || !Array.isArray(data.tasks)) throw new Error("bad format");
        const files = data.files || {}; delete data.files;
        if (data.mergeMode === "add") {
          // Additive import: upsert by id, keep everything else (incl. deadline board) intact
          const upsert = (arr, item) => { const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); };
          (data.studies || []).forEach(s => upsert(state.studies, s));
          (data.tasks || []).forEach(t => upsert(state.tasks, t));
          (data.meetings || []).forEach(m => upsert(state.meetings, m));
          (data.roster || []).forEach(n => { if (!state.roster.some(x => x.toLowerCase() === n.toLowerCase())) state.roster.push(n); });
          state.roster.sort();
          // Resolve study→deadline links by stable meeting key (ids differ per device)
          (data.studies || []).forEach(s => {
            if (Array.isArray(s.linkKeys)) {
              s.linkKeys.forEach(k => {
                const m = state.meetings.find(x => x.key === k);
                if (m) { m.studyIds = m.studyIds || []; if (!m.studyIds.includes(s.id)) m.studyIds.push(s.id); }
              });
              delete s.linkKeys;
            }
          });
        } else {
          state = Object.assign({ studies: [], tasks: [], roster: [], meetings: [], teamNotes: [], userPrefs: [], profiles: [] }, data);
        }
        migrate(); saveLocal();
        Object.entries(files).forEach(([id, c]) => { try { localStorage.setItem("rt-file-" + id, c); } catch (e2) {} });
        state.studies.forEach(s => pushItem("study", s));
        state.tasks.forEach(t => pushItem("task", t));
        state.meetings.forEach(m => pushItem("meeting", m));
        pushRoster();
        render(); toast(data.mergeMode === "add" ? "Studies imported" : "Data imported");
      } catch (err) { toast("Invalid import file"); }
    };
    r.readAsText(f);
  };
  document.getElementById("sample-btn").onclick = () => {
    if (state.studies.length && !confirm("Add sample data alongside your existing data?")) return;
    loadSample(); toast("Sample data loaded");
  };
  document.getElementById("wipe-btn").onclick = () => {
    if (!confirm("Erase ALL studies, tasks, and files on this device?")) return;
    if (sb && !confirm("Also note: this only clears THIS device, not the team workspace. Continue?")) return;
    Object.keys(localStorage).filter(k => k.startsWith("rt-file-")).forEach(k => localStorage.removeItem(k));
    state = { studies: [], tasks: [], roster: [], meetings: [] }; saveLocal(); render(); toast("All data erased");
  };
}

/* ============ Forms (bottom sheets) ============ */
// afterOpen runs once the sheet is in the DOM, for sheets that need their own handlers wired
// (repeatable rows, live previews). Optional — most callers don't need it.
function openSheet(title, bodyHTML, onSave, afterOpen) {
  // Remove any prior sheet instantly — a delayed (animated) removal would leave
  // duplicate element IDs and route the Save button to the wrong handler.
  document.querySelectorAll("#sheet-bd, #sheet").forEach(el => el.remove());
  const bd = document.createElement("div"); bd.className = "sheet-backdrop"; bd.id = "sheet-bd";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.id = "sheet";
  sh.innerHTML = `
    <div class="sheet-head">
      <button id="sheet-cancel">Cancel</button>
      <h2>${esc(title)}</h2>
      <button id="sheet-save" style="font-weight:800">Save</button>
    </div>
    <div class="sheet-body">${bodyHTML}</div>`;
  document.body.appendChild(bd); document.body.appendChild(sh);
  requestAnimationFrame(() => { bd.classList.add("show"); sh.classList.add("show"); });
  bd.onclick = closeSheet;
  document.getElementById("sheet-cancel").onclick = closeSheet;
  document.getElementById("sheet-save").onclick = () => { if (onSave() !== false) closeSheet(); };
  if (typeof afterOpen === "function") afterOpen(sh);
}
function closeSheet() {
  const bd = document.getElementById("sheet-bd"), sh = document.getElementById("sheet");
  if (bd) { bd.classList.remove("show"); setTimeout(() => bd.remove(), 260); }
  if (sh) { sh.classList.remove("show"); setTimeout(() => sh.remove(), 320); }
  editingRef = null;
}
function selectHTML(id, options, selected) {
  return `<select id="${id}">` + options.map(o => `<option ${o === selected ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
}

// `onCreated(newStudyId)` fires only for brand-new studies, after the save succeeds. It lets a
// caller (e.g. the Link Projects sheet) hand off to the study form and then pick up where it
// left off with the new study in hand.
// Checkbox rows for the study form's Team picker. Anyone already on the study is shown (and
// ticked) even if they somehow aren't in the roster, so an edit can never silently drop someone.
function teamPickerRowsHTML(selectedNames) {
  const picked = (selectedNames || []).map(canonName);
  const all = [...new Set(state.roster.concat(picked))].sort((a, b) => a.localeCompare(b));
  if (!all.length) return `<div style="color:var(--text2);font-size:13.5px;padding:12px 10px">No people on file yet — add someone below.</div>`;
  return all.map(n => `
    <div class="frow team-row" style="gap:12px;cursor:pointer" data-search="${esc(n.toLowerCase())}">
      <input type="checkbox" class="f-team-pick" data-name="${esc(n)}" ${picked.includes(n) ? "checked" : ""}>
      <span style="flex:1;min-width:0;font-size:15px">${esc(n)}</span>
    </div>`).join("");
}
// Multi-select degree picker for one roster member. Anyone signed in can set these, so degrees
// exist for people who haven't made an account yet and author lists work right away.
function openDegreesSheet(name) {
  if (blockOfflineEdit("Editing degrees")) return;
  const person = canonName(name);
  const current = degreesFor(person);
  const extra = current.filter(d => !DEGREE_OPTIONS.includes(d));
  openSheet(`${person}'s Degrees`, `
    <div style="font-size:13.5px;color:var(--text2);margin:2px 2px 12px 2px">Tick every degree that should appear after their name on an author list. Order follows the list below.</div>
    <div class="fgroup">
      ${DEGREE_OPTIONS.concat(extra).map(d => `
        <div class="frow degree-row" style="gap:12px;cursor:pointer">
          <input type="checkbox" class="degree-pick" data-degree="${esc(d)}" ${current.includes(d) ? "checked" : ""}>
          <span style="flex:1;font-size:15px">${esc(d)}</span>
        </div>`).join("")}
    </div>
    <div class="fgroup">
      <div class="frow"><label>Other</label><input id="f-degree-other" placeholder="e.g. MSc — comma-separated"></div>
    </div>
    <div style="font-size:13px;color:var(--text2);margin:0 2px">Preview: <b id="degree-preview">${esc(authorName(person))}</b></div>`,
    () => {
      const picked = [...document.querySelectorAll(".degree-pick")].filter(c => c.checked).map(c => c.dataset.degree);
      const other = document.getElementById("f-degree-other").value.split(",").map(x => x.trim()).filter(Boolean);
      const all = [...new Set(picked.concat(other))];
      setDegreesFor(person, all);
      render();
      toast(all.length ? `${person}, ${all.join(", ")}` : `Degrees cleared for ${person}`);
    });
  // Live preview so it's obvious what the author list will read like.
  const refresh = () => {
    const picked = [...document.querySelectorAll(".degree-pick")].filter(c => c.checked).map(c => c.dataset.degree);
    const other = document.getElementById("f-degree-other").value.split(",").map(x => x.trim()).filter(Boolean);
    const all = [...new Set(picked.concat(other))];
    document.getElementById("degree-preview").textContent = all.length ? `${person}, ${all.join(", ")}` : person;
  };
  bindRowCheckboxes(".degree-row");
  document.querySelectorAll(".degree-pick").forEach(c => c.onchange = refresh);
  document.getElementById("f-degree-other").oninput = refresh;
}

    () => {

      if (existing && isStale("study", s.id, editingRef && editingRef.baseline)) {
        if (!confirmOverwriteOrReload("study", s.id)) return false;
      }
      Object.assign(s, {
        title,
        nickname: document.getElementById("f-nickname").value.trim(),
        pi: document.getElementById("f-pi").value.trim(),
        team: [...document.querySelectorAll(".f-team-pick")].filter(c => c.checked).map(c => c.dataset.name),
        design: document.getElementById("f-design").value,
        phase: document.getElementById("f-phase").value,
        priority: document.getElementById("f-priority").value,
        irb: document.getElementById("f-irb").value.trim(),
        irbStatus: document.getElementById("f-irbstatus").value,
        irbExpiry: document.getElementById("f-irb-expiry").value,
        nct: document.getElementById("f-nct").value.trim(),

        // `notes` is deliberately absent: notes now live in s.noteEntries, edited inline in

        journal: document.getElementById("f-journal").value.trim(),
        submittedDate: document.getElementById("f-submitted-date").value,
        journalTrackingId: document.getElementById("f-tracking-id").value.trim(),
        revisionsReceivedDate: document.getElementById("f-revisions-received").value,
        revisionsDeadline: document.getElementById("f-revisions-deadline").value,
        enrollCurrent: document.getElementById("f-enroll-cur").value.trim(),
        enrollTarget: document.getElementById("f-enroll-tgt").value.trim(),

          enabled: document.getElementById("f-grant-enabled").checked,
          amount: document.getElementById("f-grant-amount").value.trim(),
          source: document.getElementById("f-grant-source").value.trim(),
          awardDate: document.getElementById("f-grant-award-date").value,
          balance: document.getElementById("f-grant-balance").value.trim(),
          expirationDate: document.getElementById("f-grant-expiration").value,
          balanceUpdatedDate: document.getElementById("f-grant-balance-updated").value
        }

  bindRowCheckboxes("#f-team-list .team-row");
  // Adding someone new: append them ticked, add to the roster, and clear the search so the new
  // row is definitely visible rather than filtered out by a stale query.
  const addTeamMember = () => {
    const input = document.getElementById("f-team-new");
    const name = canonName(input.value);
    if (!name) return;
    if (!state.roster.includes(name)) { state.roster.push(name); state.roster.sort((a, b) => a.localeCompare(b)); pushRoster(); }
    const picked = [...document.querySelectorAll(".f-team-pick")].filter(c => c.checked).map(c => c.dataset.name);
    if (!picked.includes(name)) picked.push(name);
    document.getElementById("f-team-list").innerHTML = teamPickerRowsHTML(picked);
    bindRowCheckboxes("#f-team-list .team-row");
    const search = document.getElementById("f-team-search");
    search.value = "";
    search.dispatchEvent(new Event("input"));
    input.value = "";
    toast(name + " added");
  };
  document.getElementById("f-team-add").onclick = addTeamMember;
  document.getElementById("f-team-new").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addTeamMember(); }
  });

  document.getElementById("f-design").onchange = (e) => {
    const phases = TRACK_PHASES[e.target.value];
    const phaseSel = document.getElementById("f-phase");
    const current = phaseSel.value;
    phaseSel.innerHTML = phases.map(p => `<option ${p === current ? "selected" : ""}>${esc(p)}</option>`).join("");
    if (!phases.includes(current)) phaseSel.value = phases[0];
    togglePhaseRows();
  };
  const togglePhaseRows = () => {
    const phase = document.getElementById("f-phase").value;
    document.getElementById("journal-row").style.display = SUBMITTED_PHASES.includes(phase) ? "flex" : "none";
    document.getElementById("revisions-row").style.display = phase === "Revisions Required" ? "flex" : "none";
  };
  document.getElementById("f-phase").onchange = togglePhaseRows;
  document.getElementById("f-grant-enabled").onchange = (e) => {
    document.getElementById("grant-row").style.display = e.target.checked ? "flex" : "none";
  };
}

function openTaskForm(existing, presetStudyId) {
  if (blockOfflineEdit(existing ? "Editing a task" : "Adding a task")) return;
  const t = existing || { id: uid(), title: "", studyId: presetStudyId || "", due: "", assignees: [], notes: "", done: false };
  editingRef = existing ? { kind: "task", id: t.id, baseline: remoteMeta[t.id] ? remoteMeta[t.id].updated_at : null } : null;
  const studyOpts = [`<option value="">(none)</option>`]
    .concat(state.studies.map(s => `<option value="${s.id}" ${s.id === t.studyId ? "selected" : ""}>${esc(s.title)}</option>`)).join("");
  openSheet(existing ? "Edit Task" : "New Task", `
    <div class="fgroup">
      <div class="frow"><label>Task</label><input id="f-ttitle" placeholder="What needs doing?" value="${esc(t.title)}"></div>
      <div class="frow"><label>Study</label><select id="f-tstudy">${studyOpts}</select></div>
      <div class="frow"><label>Due</label><input id="f-tdue" type="date" value="${esc(t.due || "")}"></div>
      <div class="frow"><label>Assignees</label><input id="f-tassignee" list="dl-people" placeholder="Who's on it? (comma-separate for more than one)" value="${esc((t.assignees || []).join(", "))}"></div>
    </div>
    <datalist id="dl-people">${state.roster.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="fgroup">
      <div class="frow"><textarea id="f-tnotes" placeholder="Notes…">${esc(t.notes || "")}</textarea></div>
    </div>
    ${existing && t.studyId && studyById(t.studyId) ? `<button type="button" class="btn secondary" id="f-tgoto-study">Open Study: ${esc(studyById(t.studyId).nickname || studyById(t.studyId).title)} ›</button>` : ""}
    ${existing && t.linkedMeetingId && state.meetings.find(x => x.id === t.linkedMeetingId) ? `<button type="button" class="btn secondary" id="f-tgoto-meeting">View Deadline: ${esc(state.meetings.find(x => x.id === t.linkedMeetingId).name)} ›</button>` : ""}
    ${existing ? `<button class="btn danger" id="f-tdel">Delete Task</button>` : ""}`,
    () => {
      const title = document.getElementById("f-ttitle").value.trim();
      if (!title) { toast("Task name is required"); return false; }
      if (existing && isStale("task", t.id, editingRef && editingRef.baseline)) {
        if (!confirmOverwriteOrReload("task", t.id)) return false;
      }
      Object.assign(t, {
        title,
        studyId: document.getElementById("f-tstudy").value,
        due: document.getElementById("f-tdue").value,
        assignees: document.getElementById("f-tassignee").value.split(",").map(a => a.trim()).filter(Boolean),
        notes: document.getElementById("f-tnotes").value.trim()
      });
      upsertTask(t);
      toast(existing ? "Task updated" : "Task added");
    });
  const del = document.getElementById("f-tdel");
  if (del) del.onclick = () => { if (blockOfflineEdit("Deleting a task")) return; removeTask(t.id); closeSheet(); toast("Task deleted"); };
  const gotoStudy = document.getElementById("f-tgoto-study");
  if (gotoStudy) gotoStudy.onclick = () => { openStudy(t.studyId); tab = "studies"; closeSheet(); render(); };
  const gotoMeeting = document.getElementById("f-tgoto-meeting");
  if (gotoMeeting) gotoMeeting.onclick = () => {
    const m = state.meetings.find(x => x.id === t.linkedMeetingId);
    if (m) openMeetingForm(m);
  };
}

function openMeetingForm(existing) {
  if (blockOfflineEdit(existing ? "Editing a deadline" : "Adding a deadline")) return;
  const m = existing || { id: uid(), society: "AAOS", name: "", type: "abstract", location: "", dates: "", deadline: "", link: "", unconfirmed: false };
  editingRef = existing ? { kind: "meeting", id: m.id, baseline: remoteMeta[m.id] ? remoteMeta[m.id].updated_at : null } : null;
  const typeLabel = { abstract: "Abstract", grant: "Grant / Funding" };
  openSheet(existing ? "Edit Deadline" : "New Deadline", `
    <div class="fgroup">
      <div class="frow"><label>Type</label><select id="f-mtype"><option value="abstract" ${(m.type || "abstract") === "abstract" ? "selected" : ""}>Abstract</option><option value="grant" ${m.type === "grant" ? "selected" : ""}>Grant / Funding</option></select></div>
      <!-- allSocieties(), not SOCIETIES: a feed-only society (ISHA, ORS, …) would otherwise be
           missing from this dropdown, so opening Edit on one of those meetings and saving would
           silently reassign it to whichever society happened to be first in the list. -->
      <div class="frow"><label>Society</label>${selectHTML("f-msoc", Object.keys(allSocieties()), m.society)}</div>
      <div class="frow"><label>Name</label><input id="f-mname" placeholder="e.g. 2027 Annual Meeting or Clinical Research Award" value="${esc(m.name)}"></div>
      <div class="frow"><label>LOI due</label><input id="f-mloi" type="date" value="${esc(m.loiDeadline || "")}"></div>
      <div class="frow"><label id="f-mdeadline-lbl">${(m.type || "abstract") === "grant" ? "Application due" : "Deadline"}</label><input id="f-mdeadline" type="date" value="${esc(m.deadline || "")}"></div>
      <div class="frow"><label>Meeting dates</label><input id="f-mdates" placeholder="e.g. Mar 3–6, 2027" value="${esc(m.dates || "")}"></div>
      <div class="frow"><label>Location</label><input id="f-mloc" placeholder="City" value="${esc(m.location || "")}"></div>
      <div class="frow"><label>Link</label><input id="f-mlink" placeholder="Call-for-abstracts / grant URL" value="${esc(m.link || "")}" autocapitalize="off" autocorrect="off"></div>
      <div class="frow"><label>Unconfirmed</label><input type="checkbox" id="f-municonf" ${m.unconfirmed ? "checked" : ""} style="flex:0;width:22px;height:22px"></div>
      <div class="frow"><label>Not submitting</label><input type="checkbox" id="f-mhidden" ${m.hidden ? "checked" : ""} style="flex:0;width:22px;height:22px"></div>
    </div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.5;margin:-6px 4px 12px 4px">Tick <b>Not submitting</b> to hide this from the dashboard deadline boards. It stays on file (so the deadline feed won't keep re-adding it) and you can un-hide it any time from Settings → Tracked Meetings.</div>
    <div id="grant-fields" style="display:${(m.type || "abstract") === "grant" ? "block" : "none"}">
      <div class="fgroup">
        <div class="frow"><textarea id="f-maim" placeholder="Aim — one sentence describing the grant's purpose">${esc(m.aim || "")}</textarea></div>
      </div>
      <div class="fgroup">
        <div class="frow"><textarea id="f-mcrit" placeholder="Eligibility & criteria to apply" style="min-height:88px">${esc(m.criteria || "")}</textarea></div>
      </div>
      <div class="fgroup">
        <div class="frow"><textarea id="f-mfunded" placeholder="Recently funded titles — one per line">${esc((m.funded || []).join("\n"))}</textarea></div>
      </div>
    </div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.5;margin:-4px 4px 12px 4px">Leave <b>LOI due</b> blank if there's no letter of intent. When both are set, the LOI and the application show as two separate, linked rows on the dashboard. Tick "Unconfirmed" if you're estimating a date — it shows a ⚠︎ flag until you verify it.</div>
    ${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener" class="btn secondary" style="text-align:center;text-decoration:none">Open Call for Abstracts ↗</a>` : ""}
    ${existing ? `<button class="btn danger" id="f-mdel">Delete Meeting</button>` : ""}`,
    () => {
      const name = document.getElementById("f-mname").value.trim();
      if (!name) { toast("Meeting name is required"); return false; }
      if (existing && isStale("meeting", m.id, editingRef && editingRef.baseline)) {
        if (!confirmOverwriteOrReload("meeting", m.id)) return false;
      }
      Object.assign(m, {
        type: document.getElementById("f-mtype").value,
        society: document.getElementById("f-msoc").value,
        name,
        loiDeadline: document.getElementById("f-mloi").value,
        deadline: document.getElementById("f-mdeadline").value,
        dates: document.getElementById("f-mdates").value.trim(),
        location: document.getElementById("f-mloc").value.trim(),
        link: document.getElementById("f-mlink").value.trim(),
        unconfirmed: document.getElementById("f-municonf").checked,
        hidden: document.getElementById("f-mhidden").checked,
        aim: document.getElementById("f-maim").value.trim(),
        criteria: document.getElementById("f-mcrit").value.trim(),
        funded: document.getElementById("f-mfunded").value.split("\n").map(x => x.trim()).filter(Boolean)
      });
      upsertMeeting(m);
      toast(existing ? "Deadline updated" : "Deadline added");
    });
  document.getElementById("f-mtype").addEventListener("change", (e) => {
    document.getElementById("grant-fields").style.display = e.target.value === "grant" ? "block" : "none";
    document.getElementById("f-mdeadline-lbl").textContent = e.target.value === "grant" ? "Application due" : "Deadline";
  });
  const md = document.getElementById("f-mdel");
  if (md) md.onclick = () => { if (blockOfflineEdit("Deleting a deadline")) return; if (confirm(`Delete "${m.name}"?`)) { removeMeeting(m.id); closeSheet(); toast("Meeting deleted"); } };
}

// Keys retired from tracking. Unlike simply omitting a key from SEED_FEED/deadlines.json (which
// only stops it from being *re-seeded* on brand-new devices), listing it here actively deletes
// any matching meeting a device already synced locally or via Supabase — applyFeedEntries only
// ever adds/updates by key and never deletes on its own, so without this a removed meeting keeps
// showing up forever on any device that saw it before the removal (e.g. ICRS "8th ICRS Summit
// (Porto)", dropped 2026-08-24 per Adam's request to track ICRS World Congress only).
const REMOVED_KEYS = ["ICRS|8th ICRS Summit (Porto)"];

// Deletes any already-synced meeting (and its auto-linked submission tasks) whose key is in
// `keys` — the tombstone counterpart to applyFeedEntries. Returns how many were removed.
function removeMeetingsByKey(keys) {
  if (!keys || !keys.length) return 0;
  const set = new Set(keys);
  const toRemove = state.meetings.filter(m => m.key && set.has(m.key));
  if (!toRemove.length) return 0;
  const ids = toRemove.map(m => m.id);
  state.meetings = state.meetings.filter(m => !ids.includes(m.id));
  const orphaned = state.tasks.filter(t => ids.includes(t.linkedMeetingId)).map(t => t.id);
  state.tasks = state.tasks.filter(t => !ids.includes(t.linkedMeetingId));
  saveLocal();
  ids.forEach(deleteRemote);
  orphaned.forEach(deleteRemote);
  render();
  return toRemove.length;
}

// Merge feed entries into state.meetings. A feed entry updates the matching meeting only when its
// verifiedOn is newer than what we last applied, so manual edits between refreshes are preserved
// until a genuinely newer verified value arrives.
function applyFeedEntries(entries, fromNetwork) {
  let changed = [];
  (entries || []).forEach(e => {
    if (!e.key) return;
    let m = state.meetings.find(x => x.key === e.key)
         || state.meetings.find(x => !x.key && x.society === e.society && x.name === e.name);
    if (!m) {
      m = { id: uid(), key: e.key, society: e.society, name: e.name, type: e.type || "abstract", loiDeadline: e.loiDeadline || "", deadline: e.deadline || "", dates: e.dates || "", location: e.location || "", link: e.link || "", aim: e.aim || "", criteria: e.criteria || "", funded: Array.isArray(e.funded) ? e.funded.slice() : [], studyIds: [], unconfirmed: !!e.unconfirmed, verifiedOn: e.verifiedOn || "" };
      state.meetings.push(m); changed.push(m);
    } else if (!m.verifiedOn || (e.verifiedOn || "") > m.verifiedOn) {
      // feed-sourced fields refresh; studyIds (user associations) are preserved
      m.key = e.key; m.type = e.type || m.type || "abstract";
      if (e.name) m.name = e.name;
      m.loiDeadline = e.loiDeadline || ""; m.deadline = e.deadline || ""; m.dates = e.dates || ""; m.location = e.location || "";
      m.link = e.link || ""; m.unconfirmed = !!e.unconfirmed; m.verifiedOn = e.verifiedOn || "";
      if (e.aim != null) m.aim = e.aim;
      if (e.criteria != null) m.criteria = e.criteria;
      if (Array.isArray(e.funded)) m.funded = e.funded.slice();
      changed.push(m);
    }
  });
  if (changed.length) { saveLocal(); changed.forEach(m => pushItem("meeting", m)); render(); }
  return changed.length;
}

// Pull the hosted deadlines.json (updated biweekly) so every team device gets refreshed dates.
async function fetchDeadlineFeed() {
  try {
    const res = await fetch("./deadlines.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const entries = Array.isArray(data) ? data : data.meetings;
    const n = applyFeedEntries(entries, true);
    const feedRemovedKeys = (!Array.isArray(data) && Array.isArray(data.removedKeys)) ? data.removedKeys : [];
    const r = removeMeetingsByKey(Array.from(new Set(REMOVED_KEYS.concat(feedRemovedKeys))));
    if (n || r) toast("Deadlines updated");
  } catch (e) { /* offline or opened as a local file — seeds already cover it */ }
}

let sidebarWidth = parseInt(localStorage.getItem("rt-sidebar-width"), 10);
if (!sidebarWidth || isNaN(sidebarWidth)) sidebarWidth = 320;

function applySidebarWidth() {
  if (!$sidebar) return;
  // Collapsed width is owned by CSS (.sidebar.collapsed); clear any inline override so it applies.
  $sidebar.style.width = sidebarCollapsed ? "" : sidebarWidth + "px";
}

  if (!$sidebar) return;
  $sidebar.classList.toggle("collapsed", sidebarCollapsed);

  applySidebarWidth();

// Drag the sidebar/main divider to resize the dashboard panel
if ($sidebarResizer) {
  let dragging = false;
  $sidebarResizer.addEventListener("pointerdown", (e) => {
    if (sidebarCollapsed) return;
    dragging = true;
    $sidebarResizer.setPointerCapture(e.pointerId);
    $sidebarResizer.classList.add("dragging");
    document.body.style.userSelect = "none";
  });
  $sidebarResizer.addEventListener("pointermove", (e) => {
    if (!dragging || !$sidebar) return;
    const rect = $sidebar.getBoundingClientRect();
    sidebarWidth = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, e.clientX - rect.left));
    $sidebar.style.width = sidebarWidth + "px";
  });
  const endSidebarDrag = () => {
    if (!dragging) return;
    dragging = false;
    $sidebarResizer.classList.remove("dragging");
    document.body.style.userSelect = "";
    localStorage.setItem("rt-sidebar-width", String(Math.round(sidebarWidth)));
  };
  $sidebarResizer.addEventListener("pointerup", endSidebarDrag);
  $sidebarResizer.addEventListener("pointercancel", endSidebarDrag);
}

// Login screen handlers — bound once; the login screen markup is static (not re-rendered by
// the main render() loop), unlike the rest of the app.
let codeEmail = "";
function bindLoginScreen() {
  const submitBtn = document.getElementById("login-submit");
  const resetOffer = document.getElementById("login-reset-offer");
  const setResetOffer = (show) => { if (resetOffer) resetOffer.style.display = show ? "block" : "none"; };
  // Shared by the "Forgot password?" link and the post-failure offer below. The email carries
  // both a code and a link; we steer people to the code because the link may well be dead by
  // the time it reaches them (see showDeadLinkScreen).
  const sendReset = async (email, btn) => {
    const label = btn && btn.textContent;
    if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      if (error) throw error;
      setResetOffer(false);
      codeEmail = email;
      showLoginPane("code");
      const intro = document.getElementById("code-intro");
      if (intro) intro.textContent = "We emailed a 6-digit code to " + email + ". Enter it below — it lasts an hour. Check your junk folder if it's slow to arrive.";
      setLoginMsg("");
      const input = document.getElementById("login-code-input");
      if (input) { input.value = ""; input.focus(); }
    } catch (e) {
      setLoginMsg(e.message || "Could not send the email.");
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = label; }
    }
  };
  const doSignIn = async () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    if (!email || !password) { setLoginMsg("Enter your email and password."); return; }
    setLoginMsg("");
    setResetOffer(false);
    submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      // Success is handled by handleAuthChange() via the auth-state listener.
    } catch (e) {
      const msg = e.message || "Sign in failed.";
      // Supabase returns the same generic "Invalid login credentials" whether the password is
      // wrong or was never set at all — and "never set" is the common case for someone who was
      // invited. So offer the way out instead of leaving them stuck on a dead end.
      if (/invalid\s+login\s+credentials|invalid\s+credentials/i.test(msg)) {
        setLoginMsg("That email and password don't match.");
        setResetOffer(true);
      } else {
        setLoginMsg(msg);
      }
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = "Sign In";
    }
  };
  const resetSendBtn = document.getElementById("login-reset-send");
  if (resetSendBtn) resetSendBtn.onclick = () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const email = document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Enter your email above first."); return; }
    sendReset(email, resetSendBtn);
  };
  submitBtn.onclick = doSignIn;
  document.getElementById("login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") doSignIn(); });
  const forgotBtn = document.getElementById("login-forgot");
  forgotBtn.onclick = async () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const email = document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Enter your email above first, then tap Forgot password."); return; }
    setLoginMsg("");
    await sendReset(email, forgotBtn);
  };
  // One code box serves resets and invites. We don't ask which kind of email arrived — nobody
  // knows or cares — so try the plausible types in turn. Supabase rejects the wrong type
  // without spending the code, so a miss costs nothing but a round trip.
  const verifyCode = async () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const input = document.getElementById("login-code-input");
    const token = (input.value || "").replace(/\s|-/g, "");
    const email = codeEmail || document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Go back and enter your email first."); return; }
    if (token.length < 6) { setLoginMsg("Enter the 6-digit code from the email."); return; }
    const btn = document.getElementById("login-code-submit");
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Checking…";
    setLoginMsg("");
    let lastErr = null;
    try {
      for (const type of ["recovery", "invite", "signup", "magiclink", "email"]) {
        const { data, error } = await sb.auth.verifyOtp({ email, token, type });
        if (!error && data && data.session) {
          // A code proves they own the mailbox, exactly like a link would, so hand them
          // straight to the password box rather than bouncing them back to sign in.
          pendingPasswordSetup = true;
          authLinkType = (type === "invite" || type === "signup") ? "invite" : "recovery";
          authLinkError = null;
          showPasswordSetup(authLinkType === "invite");
          return;
        }
        lastErr = error;
        // A wrong/expired code is final — no point trying the other types.
        if (error && /expired|invalid/i.test(error.message || "") && type !== "recovery") break;
      }
      setLoginMsg((lastErr && /expired/i.test(lastErr.message || ""))
        ? "That code has expired. Send a new one below."
        : "That code didn't match. Check the email and try again, or send a new one.");
    } catch (e) {
      setLoginMsg(e.message || "Could not check that code.");
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  };
  document.getElementById("login-code-submit").onclick = verifyCode;
  document.getElementById("login-code-input").addEventListener("keydown", (e) => { if (e.key === "Enter") verifyCode(); });
  document.getElementById("login-code-resend").onclick = () => {
    const email = codeEmail || document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Go back and enter your email first."); return; }
    sendReset(email, document.getElementById("login-code-resend"));
  };
  document.getElementById("login-code-back").onclick = () => {
    showLoginPane("fields");
    setLoginMsg("");
  };
  // Someone invited by email already holds a code, so don't force them to burn it and wait
  // for a second one just to reach the box.
  document.getElementById("login-have-code").onclick = () => {
    const email = document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Enter your email above first."); return; }
    codeEmail = email;
    showLoginPane("code");
    const intro = document.getElementById("code-intro");
    if (intro) intro.textContent = "Enter the 6-digit code from the email we sent to " + email + ".";
    setLoginMsg("");
    const input = document.getElementById("login-code-input");
    if (input) { input.value = ""; input.focus(); }
  };

  document.getElementById("recovery-submit").onclick = async () => {
    if (!sb) return;
    const password = document.getElementById("recovery-password").value;
    if (!password || password.length < 6) { setLoginMsg("Password must be at least 6 characters."); return; }
    setLoginMsg("");
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      // Clear the one-time token out of the URL so a refresh doesn't bounce them back to this
      // screen, then let them straight through — the invite link already signed them in, so
      // making them retype the password they just chose would be pointless.
      pendingPasswordSetup = false;
      authLinkType = "";
      codeEmail = "";
      try { history.replaceState(null, "", window.location.pathname); } catch (e) { /* non-fatal */ }
      showLoginPane("fields");
      const { data: sess } = await sb.auth.getSession();
      if (sess && sess.session) {
        await handleAuthChange("SIGNED_IN", sess.session);
        toast("Password set — you're signed in");
      } else {
        setLoginMsg("Password set. Sign in with your email and new password.", "info");
      }
    } catch (e) {
      setLoginMsg(e.message || "Could not update password.");
    }
  };
}
