function renderStudies() {
  $title.textContent = "Studies";
  const filters = ["Active", "All", "Published", "On Hold"];
  const myName = me();
  // Who-filter: defaults to "mine" (only studies I'm involved in as PI/team/task assignee).
  // Gracefully falls back to showing everyone if no identity is set yet. Applied first, before
  // the status/phase/design filters below, so their counts reflect the selected person.
  // Start from what this person is allowed to see at all, then apply the Who filter on top.
  let base = visibleStudies();
  if (personFilter === "mine") { if (myName) base = base.filter(s => studyInvolvesPerson(s, myName)); }
  else if (personFilter !== "all") base = base.filter(s => studyInvolvesPerson(s, personFilter));
  if (studyFilter === "Active") base = base.filter(isActive);
  else if (studyFilter !== "All") base = base.filter(s => s.phase === studyFilter);
  if (studySearchQuery) base = base.filter(s => studyMatchesSearch(s, studySearchQuery));
  const phaseCount = {};
  base.forEach(s => { phaseCount[s.phase] = (phaseCount[s.phase] || 0) + 1; });
  const presentPhases = PHASES.filter(p => phaseCount[p]);
  if (studyPhaseFilter !== "All phases" && !presentPhases.includes(studyPhaseFilter)) studyPhaseFilter = "All phases";

  const designCount = {};
  base.forEach(s => { const d = s.design || "Unspecified"; designCount[d] = (designCount[d] || 0) + 1; });
  const presentDesigns = DESIGNS.filter(d => designCount[d]);
  if (studyDesignFilter !== "All designs" && !presentDesigns.includes(studyDesignFilter)) studyDesignFilter = "All designs";

  let list = (studyPhaseFilter === "All phases") ? base : base.filter(s => s.phase === studyPhaseFilter);
  if (studyDesignFilter !== "All designs") list = list.filter(s => s.design === studyDesignFilter);
  list.sort((a, b) => PHASES.indexOf(a.phase) - PHASES.indexOf(b.phase) || a.title.localeCompare(b.title));

  let html = `<div class="seg">` + filters.map(f =>
    `<button class="${f === studyFilter ? "active" : ""}" data-filter="${f}">${f}</button>`).join("") + `</div>`;
  html += searchBoxHTML("study-search", studySearchQuery, "Search by title, nickname, PI, or IRB #");
  html += filterSetsBarHTML("studies", studyViewId);
  const otherNames = state.roster.filter(n => n.trim().toLowerCase() !== myName.trim().toLowerCase());
  // Only admins can look beyond their own projects, so the Who picker is theirs alone. Everyone
  // else is already scoped by visibleStudies() and would just see "All" == "Mine".
  if (isAdmin()) {
    html += `<div style="display:flex;align-items:center;gap:8px;margin:0 4px 10px 4px">
      <span style="font-size:13px;font-weight:600;color:var(--text2)">Who</span>
      <select id="person-filter" style="flex:1;-webkit-appearance:none;appearance:none;background:var(--card);border:none;border-radius:10px;padding:9px 30px 9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none;box-shadow:0 1px 2px rgba(0,0,0,0.06)">
        <option value="mine" ${personFilter === "mine" ? "selected" : ""}>${myName ? "My Projects (" + esc(myName) + ")" : "My Projects"}</option>
        <option value="all" ${personFilter === "all" ? "selected" : ""}>All Projects</option>
        ${otherNames.map(n => `<option value="${esc(n)}" ${personFilter === n ? "selected" : ""}>${esc(n)}'s Projects</option>`).join("")}
      </select>
    </div>`;
  }
  html += `<div style="display:flex;align-items:center;gap:8px;margin:0 4px 10px 4px">
      <span style="font-size:13px;font-weight:600;color:var(--text2)">Phase</span>
      <select id="phase-filter" style="flex:1;-webkit-appearance:none;appearance:none;background:var(--card);border:none;border-radius:10px;padding:9px 30px 9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none;box-shadow:0 1px 2px rgba(0,0,0,0.06)">
        <option value="All phases" ${studyPhaseFilter === "All phases" ? "selected" : ""}>All phases (${base.length})</option>
        ${presentPhases.map(p => `<option value="${esc(p)}" ${p === studyPhaseFilter ? "selected" : ""}>${esc(p)} (${phaseCount[p]})</option>`).join("")}
      </select>
    </div>`;
  html += `<div style="display:flex;align-items:center;gap:8px;margin:0 4px 14px 4px">
      <span style="font-size:13px;font-weight:600;color:var(--text2)">Design</span>
      <select id="design-filter" style="flex:1;-webkit-appearance:none;appearance:none;background:var(--card);border:none;border-radius:10px;padding:9px 30px 9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none;box-shadow:0 1px 2px rgba(0,0,0,0.06)">
        <option value="All designs" ${studyDesignFilter === "All designs" ? "selected" : ""}>All designs (${base.length})</option>
        ${presentDesigns.map(d => `<option value="${esc(d)}" ${d === studyDesignFilter ? "selected" : ""}>${esc(DESIGN_SHORT[d] || d)} (${designCount[d]})</option>`).join("")}
      </select>
    </div>`;
  if (!list.length) {
    html += studySearchQuery
      ? `<div class="empty"><div class="big">🔍</div>No studies match "${esc(studySearchQuery)}".</div>`
      : `<div class="empty"><div class="big">⚗️</div>No studies match this filter.<br>Tap <b>+</b> to add one.</div>`;
  } else {
    html += list.map(studyCardHTML).join("");
  }
  $main.innerHTML = html;
  $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { studyFilter = b.dataset.filter; studyPhaseFilter = "All phases"; studyDesignFilter = "All designs"; render(); });
  bindSearchBox("study-search", (v) => { studySearchQuery = v; });
  bindFilterSetsBar("studies", (id) => { studyViewId = id; });
  const personSel = document.getElementById("person-filter"); // admins only
  if (personSel) personSel.onchange = (e) => { personFilter = e.target.value; studyPhaseFilter = "All phases"; studyDesignFilter = "All designs"; render(); };
  document.getElementById("phase-filter").onchange = (e) => { studyPhaseFilter = e.target.value; render(); };
  document.getElementById("design-filter").onchange = (e) => { studyDesignFilter = e.target.value; render(); };
  $main.querySelectorAll("[data-study]").forEach(el => el.onclick = () => { openStudy(el.dataset.study); render(); });
}

function nextAfterInit(s) { return phasesFor(s)[2] || "Enrolling"; }

function enrollmentBodyHTML(s) {
  const tgt = parseInt(s.enrollTarget, 10);
  const cur = parseInt(s.enrollCurrent, 10);
  const hasAny = s.enrollTarget !== "" || s.enrollCurrent !== "";
  if (!hasAny) return `<div style="color:var(--text2);font-size:14px">No enrollment numbers yet. Tap Edit Study to add a target and current count.</div>`;
  const pct = (tgt > 0 && !isNaN(cur)) ? Math.min(100, Math.round(100 * cur / tgt)) : 0;
  return `
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-size:26px;font-weight:800">${isNaN(cur) ? "—" : cur}<span style="font-size:15px;color:var(--text2);font-weight:600"> / ${isNaN(tgt) ? "—" : tgt}</span></div>
      <div style="font-size:13px;color:var(--text2);font-weight:600">${tgt > 0 && !isNaN(cur) ? pct + "% of target" : "enrolled / target"}</div>
    </div>
    ${tgt > 0 ? `<div class="progressbar" style="margin-top:8px;height:7px"><div style="width:${pct}%;background:${pct >= 100 ? "var(--green)" : "var(--blue)"}"></div></div>` : ""}`;
}
function enrollmentHasContent(s) { return s.enrollTarget !== "" || s.enrollCurrent !== ""; }

// ---------- Initiation stages ----------
// The stage list is data, not code: Adam expects it to grow ("this list I likely will have to
// figure out"). It lives on the shared roster record so the whole team sees the same stages,
// and falls back to these six when nothing has been customised.
// Ordered roughly as a site actually activates, from Carla Edwards' (CRCM) list. The six
// original keys — coverage, irb, contract, piq, redcap, sync — are DELIBERATELY unchanged even
// where the wording improved, because studies already carry recorded dates against them and
// renaming a key would orphan that history.
const DEFAULT_INITIATION_STAGES = [
  { key: "feasibility", label: "Feasibility & site selection (SQV)" },
  { key: "irb",         label: "IRB approval" },
  { key: "pcoi",        label: "pCOI / investigator disclosures" },
  { key: "extIrb",      label: "External site IRB approvals (lead site)" },
  { key: "coverage",    label: "Coverage analysis — initial" },
  { key: "coverageFinal", label: "Coverage analysis — final" },
  { key: "sync",        label: "SYNC" },
  { key: "oncore",      label: "ONCORE — open to accrual" },
  { key: "contract",    label: "Contracting (CTA / DUA)" },
  // Patient IQ is the primary platform here; REDCap is used only for pediatric assent
  // consenting, so it's N/A on most studies — the label says so to save people wondering.
  { key: "piq",         label: "Patient IQ build (primary EDC)" },
  { key: "redcap",      label: "REDCap build — pediatric assent consent only" },
  { key: "systems",     label: "Systems access & training (eConsent, payments, billing)" },
  { key: "labs",        label: "Labs, supply & pharmacy readiness" },
  // Deliberately ahead of activation. For an applicable clinical trial, ICMJE journals want
  // registration BEFORE the first patient enrols, and registering late can't be undone — the
  // journal may still refuse the paper. Every other stage costs time when it slips; this one
  // costs the publication, which is why it sits on the critical path rather than in a footnote.
  { key: "ctgov",       label: "ClinicalTrials.gov registration (before first enrolment)" },
  { key: "siv",         label: "Site Initiation Visit (SIV)" },
  { key: "activation",  label: "Site activation / first patient in" }
];
const STAGE_STATUSES = ["Not started", "Submitted", "Passed", "N/A"];
const STAGE_COLORS = {
  "Not started": "var(--text2)",
  "Submitted": "var(--orange)",
  "Passed": "var(--green)",
  "N/A": "var(--line)"
};
function initiationStages() {
  const list = state.initiationStages;
  return (Array.isArray(list) && list.length) ? list : DEFAULT_INITIATION_STAGES;
}
function stageInfo(s, key) {
  const m = (s.initiationProgress || {})[key] || {};
  return {
    status: STAGE_STATUSES.includes(m.status) ? m.status : "Not started",
    submitted: m.submitted || "",
    passed: m.passed || ""
  };
}
// Stages that actually count toward "ready": N/A is a pass, not a gap.
function initiationDone(s) {
  const stages = initiationStages();
  const counted = stages.filter(st => stageInfo(s, st.key).status !== "N/A");
  const passed = counted.filter(st => stageInfo(s, st.key).status === "Passed");
  return { passed: passed.length, total: counted.length };
}
function isProspective(s) { return (s.design || "") === "Prospective (Consented)"; }

/* ============ Freshness: has anyone touched this lately? ============ */
// A study nobody has touched in a fortnight has usually been forgotten rather than finished, and
// the Worklist is where that should be embarrassing. Two weeks = stale, four = rotten.
const STALE_DAYS = 14;
const ROTTEN_DAYS = 28;
// On Hold and Published are deliberately parked — silence there means the system is working, so
// they're exempt. Everything else is fair game.
const FRESHNESS_EXEMPT_PHASES = ["On Hold", "Published"];
// "Touched" means the study row OR any of its tasks was saved, because ticking off a task is
// unmistakably work on the study even though the study record itself didn't change. Timestamps
// come from Supabase's own updated_at via remoteMeta — the same source the sync uses for conflict
// detection — so this measures real saves, not just someone opening the page.
function lastTouchedAt(s) {
  let latest = "";
  const meta = remoteMeta[s.id];
  if (meta && meta.updated_at) latest = meta.updated_at;
  state.tasks.forEach(t => {
    if (t.studyId !== s.id) return;
    const tm = remoteMeta[t.id];
    if (tm && tm.updated_at && tm.updated_at > latest) latest = tm.updated_at;
  });
  return latest;
}
function freshness(s) {
  if (!s || FRESHNESS_EXEMPT_PHASES.indexOf(s.phase || "") >= 0) return null;
  const at = lastTouchedAt(s);
  // No timestamp means Team Sync has never seen it, not that it's ancient. Guessing "rotten" here
  // would light up the whole board the first time someone opens it offline.
  if (!at) return null;
  const days = Math.floor((Date.now() - new Date(at).getTime()) / 86400000);
  if (days >= ROTTEN_DAYS) return { level: "rotten", days, label: "ROTTEN", note: `untouched ${days} days` };
  if (days >= STALE_DAYS) return { level: "stale", days, label: "STALE", note: `untouched ${days} days` };
  return { level: "fresh", days, label: "", note: "" };
}

// IRB continuing review. Approval isn't permanent — it expires, and anything enrolled after a
// lapse is a reportable problem, so this needs to shout well before the date rather than on it.
// Thresholds match the email alerts so the screen and the inbox never disagree.
const IRB_EXPIRY_STEPS = [90, 60, 30];
function irbExpiryState(s) {
  const d = (s && s.irbExpiry) || "";
  if (!d) return null;
  const days = daysUntil(d);
  if (days < 0) {
    return { days, level: "lapsed", color: "var(--red)",
      label: `IRB LAPSED ${Math.abs(days)}d ago`,
      detail: "Continuing review has expired. Enrolling or collecting data past this date is reportable — stop and check with the IRB." };
  }
  if (days <= 30) return { days, level: "urgent", color: "var(--red)", label: `IRB expires in ${days}d`, detail: "Continuing review is due now." };
  if (days <= 60) return { days, level: "soon", color: "var(--orange)", label: `IRB expires in ${days}d`, detail: "Continuing review is coming up." };
  if (days <= 90) return { days, level: "watch", color: "var(--orange)", label: `IRB expires in ${days}d`, detail: "Start the continuing review packet." };
  return { days, level: "ok", color: "var(--text2)", label: `IRB expires ${fmtDate(d)}`, detail: "" };
}
// Studies that are actually exposed by a lapse — a finished study with an expired approval is
// untidy, not dangerous, so it shouldn't compete for attention with one still enrolling.
function irbExpiryMatters(s) {
  const live = ["Initiation", "Enrolling", "Data Collection", "Data Extraction"];
  return isProspective(s) && live.indexOf(s.phase || "") >= 0;
}

// Team-wide editor for WHICH stages are tracked. Removing a stage only stops it being listed —
// any dates already recorded against it stay on the study record untouched, per the standing
// rule that nothing is destroyed without being asked for.
function openStagesSheet() {
  if (!isAdmin()) { toast("Only admins can change the stage list"); return; }
  if (blockOfflineEdit("Editing the stage list")) return;
  const rows = initiationStages().slice();
  const rowHTML = (st, i) => `
    <div class="fgroup" data-stage-row="${i}">
      <div class="frow"><label>Stage</label><input class="stage-label" value="${esc(st.label)}" placeholder="e.g. Sponsor agreement"></div>
      <div class="frow" style="border-bottom:none">
        <label style="color:var(--text2);font-size:12.5px">Key: ${esc(st.key)}</label>
        <button class="mini-btn stage-drop" style="margin:0;color:var(--red)">Stop tracking</button>
      </div>
    </div>`;
  openSheet("Initiation stages", `
    <div class="card" style="font-size:12.5px;color:var(--text2);line-height:1.5">
      These are the stages every prospective study is tracked against. Renaming one keeps its
      history. <b>Stop tracking</b> only removes it from this list — dates already recorded stay
      on the study and come back if you add the stage again.
    </div>
    <div id="stage-rows">${rows.map(rowHTML).join("")}</div>
    <button class="mini-btn" id="stage-add">＋ Add a stage</button>`,
    () => {
      const out = [];
      document.querySelectorAll("#stage-rows [data-stage-row]").forEach(row => {
        if (row.dataset.dropped === "1") return;
        const label = row.querySelector(".stage-label").value.trim();
        if (!label) return;
        // Existing rows keep their key; new ones get one derived from the label.
        const key = row.dataset.key || label.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 24) || uid().slice(0, 8);
        out.push({ key, label });
      });
      if (!out.length) { toast("Keep at least one stage"); return false; }
      state.initiationStages = out;
      saveLocal(); pushRoster(); render();
      toast("Stage list saved — it applies to every study");
    },
    (sheet) => {
      rows.forEach((st, i) => {
        const row = sheet.querySelector(`[data-stage-row="${i}"]`);
        if (row) row.dataset.key = st.key;
      });
      const wire = (row) => {
        const drop = row.querySelector(".stage-drop");
        if (drop) drop.onclick = () => {
          row.dataset.dropped = row.dataset.dropped === "1" ? "" : "1";
          const off = row.dataset.dropped === "1";
          row.style.opacity = off ? "0.45" : "";
          drop.textContent = off ? "Keep tracking" : "Stop tracking";
        };
      };
      sheet.querySelectorAll("[data-stage-row]").forEach(wire);
      const add = sheet.querySelector("#stage-add");
      if (add) add.onclick = () => {
        const wrap = sheet.querySelector("#stage-rows");
        const i = wrap.querySelectorAll("[data-stage-row]").length;
        const div = document.createElement("div");
        div.className = "fgroup";
        div.setAttribute("data-stage-row", String(i));
        div.innerHTML = `<div class="frow"><label>Stage</label><input class="stage-label" placeholder="e.g. Sponsor agreement"></div>
          <div class="frow" style="border-bottom:none"><label style="color:var(--text2);font-size:12.5px">New stage</label>
          <button class="mini-btn stage-drop" style="margin:0;color:var(--red)">Stop tracking</button></div>`;
        wrap.appendChild(div);
        wire(div);
      };
    });
}

// Per-study editor for the initiation stages: status plus the dates it was submitted and
// cleared, which is the whole point of the board (when did it go in, when did it pass).
function openInitiationSheet(studyId) {
  const s = studyById(studyId);
  if (!s) return;
  if (blockOfflineEdit("Editing initiation stages")) return;
  const stages = initiationStages();
  openSheet("Initiation — " + (s.nickname || s.title), stages.map(st => {
    const info = stageInfo(s, st.key);
    return `<div class="fgroup">
      <div class="frow"><label>${esc(st.label)}</label>${selectHTML("f-st-" + st.key, STAGE_STATUSES, info.status)}</div>
      <div class="frow"><label>Submitted</label><input id="f-sub-${esc(st.key)}" type="date" value="${esc(info.submitted)}"></div>
      <div class="frow"><label>Passed</label><input id="f-pass-${esc(st.key)}" type="date" value="${esc(info.passed)}"></div>
    </div>`;
  }).join("") + `<div class="card" style="font-size:12.5px;color:var(--text2);line-height:1.5">
      Mark a stage <b>N/A</b> when it doesn't apply to this study — it counts as cleared rather than outstanding.
    </div>`,
    () => {
      const p = {};
      stages.forEach(st => {
        p[st.key] = {
          status: document.getElementById("f-st-" + st.key).value,
          submitted: document.getElementById("f-sub-" + st.key).value,
          passed: document.getElementById("f-pass-" + st.key).value
        };
      });
      s.initiationProgress = p;
      upsertStudy(s);
      toast("Initiation stages saved");
    });
}

// Follow-up editor: counts per timepoint. No names, no dates of birth, no per-patient rows —
// see the note on followUpTotals().
function openFollowUpSheet(studyId) {
  const s = studyById(studyId);
  if (!s) return;
  if (blockOfflineEdit("Editing follow-up")) return;
  const rows = (Array.isArray(s.followUp) ? s.followUp : []).slice();
  if (!rows.length) rows.push({ id: uid(), label: "", due: "", done: "" });
  openSheet("Follow-up — " + (s.nickname || s.title),
    `<div class="card" style="font-size:12.5px;color:var(--text2);line-height:1.5">
       Counts only, deliberately: how many are due at each timepoint and how many are done. No patient-level records, so this stays outside HIPAA scope.
     </div>
     <div id="fu-rows">${rows.map((r, i) => `
       <div class="fgroup" data-fu-row="${i}">
         <div class="frow"><label>Timepoint</label><input class="fu-label" placeholder="e.g. 6 month" value="${esc(r.label || "")}"></div>
         <div class="frow"><label>Due</label><input class="fu-due" type="number" min="0" inputmode="numeric" value="${esc(String(r.due ?? ""))}"></div>
         <div class="frow"><label>Completed</label><input class="fu-done" type="number" min="0" inputmode="numeric" value="${esc(String(r.done ?? ""))}"></div>
       </div>`).join("")}</div>
     <button class="mini-btn" id="fu-add">＋ Add a timepoint</button>`,
    () => {
      const out = [];
      document.querySelectorAll("#fu-rows [data-fu-row]").forEach(row => {
        const label = row.querySelector(".fu-label").value.trim();
        const due = row.querySelector(".fu-due").value;
        const done = row.querySelector(".fu-done").value;
        if (!label && due === "" && done === "") return;   // blank row, skip
        out.push({ id: uid(), label, due: due === "" ? 0 : Number(due), done: done === "" ? 0 : Number(done) });
      });
      s.followUp = out;
      upsertStudy(s);
      toast("Follow-up saved");
    },
    () => {
      const addBtn = document.getElementById("fu-add");
      if (addBtn) addBtn.onclick = () => {
        const wrap = document.getElementById("fu-rows");
        const i = wrap.querySelectorAll("[data-fu-row]").length;
        const div = document.createElement("div");
        div.className = "fgroup";
        div.setAttribute("data-fu-row", String(i));
        div.innerHTML = `<div class="frow"><label>Timepoint</label><input class="fu-label" placeholder="e.g. 1 year"></div>
          <div class="frow"><label>Due</label><input class="fu-due" type="number" min="0" inputmode="numeric"></div>
          <div class="frow"><label>Completed</label><input class="fu-done" type="number" min="0" inputmode="numeric"></div>`;
        wrap.appendChild(div);
      };
    });
}

// ---------- Follow-up (aggregate only) ----------
// Counts per timepoint, never per patient — the app deliberately holds no subject-level data,
// which is what keeps it outside HIPAA scope. Real per-visit scheduling belongs in REDCap.
function followUpTotals(s) {
  const rows = Array.isArray(s.followUp) ? s.followUp : [];
  let due = 0, done = 0;
  rows.forEach(r => { due += Number(r.due) || 0; done += Number(r.done) || 0; });
  return { due, done, pct: due > 0 ? Math.round(100 * done / due) : null, rows };
}

// ---------- Study notes ----------
// Notes are dated entries with an archive lane rather than one free-text blob. "Archive"
// never deletes: it stamps entries with the date they were cleared and files them under a
// collapsed group, so the live list stays short without losing the history of what was
// cleared and when. Which archive groups are expanded is view state only (openNoteArchives),
// reset whenever a different study is opened — same lifecycle as studySectionState.
let openNoteArchives = {};
const NOTE_ICON_BTN = "border:none;background:none;color:var(--text2);cursor:pointer;padding:5px 7px;line-height:1;font-size:16px";

function noteRowHTML(n, actions) {
  return `
    <div class="milestone-row" style="align-items:flex-start">
      <div style="flex:1;min-width:0">
        ${n.date ? `<div style="font-size:12px;color:var(--text2);font-weight:600">${fmtDate(n.date)}</div>` : ""}
        <div style="font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word">${esc(n.text || "")}</div>
      </div>
      ${actions}
    </div>`;
}

function notesBodyHTML(s, inputStyle) {
  const all = s.noteEntries || [];
  const live = all.filter(n => !n.archivedOn).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const archived = all.filter(n => n.archivedOn);
  const groups = {};
  archived.forEach(n => { (groups[n.archivedOn] = groups[n.archivedOn] || []).push(n); });
  const groupDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  return `
    ${live.length ? live.map(n => noteRowHTML(n, `
      <button data-note-arch="${n.id}" title="Archive this note" style="${NOTE_ICON_BTN}">↓</button>
      <button data-note-del="${n.id}" title="Delete this note" style="${NOTE_ICON_BTN};font-size:19px">×</button>
    `)).join("") : `<div style="color:var(--text2);font-size:14px">No notes yet. Jot down anything worth remembering about this study — notes stay here until you archive them.</div>`}

    <div style="margin-top:12px">
      <textarea id="note-text" rows="2" placeholder="Add a note…" style="width:100%;box-sizing:border-box;resize:vertical;${inputStyle}"></textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
      <input id="note-date" type="date" value="${todayStr()}" style="${inputStyle};padding:9px 10px;font-size:14px;max-width:135px">
      <button id="note-add" style="border:none;background:var(--blue);color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer">Add</button>
      <div style="flex:1"></div>
      ${live.length ? `<button id="note-archive-all" style="border:none;background:var(--bg);color:var(--blue);font-family:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer">Archive all (${live.length})</button>` : ""}
    </div>

    ${groupDates.length ? `
      <div style="margin-top:16px;border-top:0.5px solid var(--line);padding-top:8px">
        <div style="font-size:11.5px;color:var(--text2);font-weight:700;letter-spacing:.05em;text-transform:uppercase">Archived</div>
        ${groupDates.map(d => {
          const open = !!openNoteArchives[d];
          const rows = groups[d].slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          return `
          <div data-note-group="${d}" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 0;user-select:none">
            <span data-note-group-chev style="font-size:11px;color:var(--text2);display:inline-block;transition:transform .2s;transform:rotate(${open ? 90 : 0}deg)">▸</span>
            <span style="font-size:14px;font-weight:600">${fmtDate(d)}</span>
            <span style="font-size:13px;color:var(--text2)">· ${rows.length} note${rows.length === 1 ? "" : "s"}</span>
          </div>
          <div data-note-group-body="${d}" style="${open ? "" : "display:none"};padding-left:19px">
            ${rows.map(n => noteRowHTML(n, `
              <button data-note-unarch="${n.id}" title="Bring this note back" style="${NOTE_ICON_BTN}">↑</button>
              <button data-note-del="${n.id}" title="Delete this note" style="${NOTE_ICON_BTN};font-size:19px">×</button>
            `)).join("")}
          </div>`;
        }).join("")}
      </div>` : ""}`;
}
// Only the live notes count toward auto-expanding the section — a study whose notes are all
// archived should open collapsed, since that's the whole point of archiving them.
function notesHasContent(s) { return (s.noteEntries || []).some(n => !n.archivedOn); }

function grantBodyHTML(s) {
  const g = s.grant || {};
  return `
    <div class="meta" style="font-size:13.5px;color:var(--text2);line-height:1.7">
      ${g.amount ? `<b>Amount awarded:</b> ${esc(g.amount)}<br>` : ""}
      ${g.source ? `<b>Awarded by:</b> ${esc(g.source)}<br>` : ""}
      ${g.awardDate ? `<b>Date of award:</b> ${fmtDate(g.awardDate)}<br>` : ""}
      ${g.balance ? `<b>Current balance:</b> ${esc(g.balance)}<br>` : ""}
      ${g.expirationDate ? `<b>Award expires:</b> ${fmtDate(g.expirationDate)}<br>` : ""}
      ${g.balanceUpdatedDate ? `<b>Balance last updated:</b> ${fmtDate(g.balanceUpdatedDate)}` : ""}
    </div>
    ${!g.amount && !g.source && !g.awardDate && !g.balance && !g.expirationDate && !g.balanceUpdatedDate ? `<div style="color:var(--text2);font-size:14px">No grant details entered yet. Tap Edit Study to add them.</div>` : ""}`;
}
function grantHasContent(s) {
  const g = s.grant;
  return !!(g && g.enabled && (g.amount || g.source || g.awardDate || g.balance || g.expirationDate || g.balanceUpdatedDate));
}

// Shows the dated stages (status, submitted, passed) rather than the old tick boxes — the same
// data the Worklist's Initiation board reads, so the two can't disagree. Kept visible after the
// study leaves Initiation because these dates are its start-up audit trail.
function initiationBodyHTML(s) {
  const stages = initiationStages();
  const d = initiationDone(s);
  const target = esc(nextAfterInit(s));
  const init = s.initiation || {};
  // A stage marked N/A drops off this list — it isn't part of this study's work, so it's just
  // noise here. The record is untouched and it's still listed in the edit sheet, so nothing is
  // lost and it can be switched back at any time.
  const shown = stages.filter(st => stageInfo(s, st.key).status !== "N/A");
  const na = stages.length - shown.length;
  return `
    <div style="font-size:12.5px;color:var(--text2);margin-bottom:8px">${d.passed} of ${d.total} stages cleared${d.passed === d.total && d.total ? ` — ready to move to <b>${target}</b>.` : ""}${na ? ` · ${na} marked not applicable and hidden below` : ""}</div>
    ${shown.map(st => {
      const info = stageInfo(s, st.key);
      const detail = [
        info.submitted ? "submitted " + fmtDate(info.submitted) : "",
        info.passed ? "passed " + fmtDate(info.passed) : ""
      ].filter(Boolean).join(" · ");
      return `
      <div class="milestone-row">
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:600">${esc(st.label)}</div>
          ${detail ? `<div style="font-size:12px;color:var(--text2);margin-top:2px">${detail}</div>` : ""}
        </div>
        <span class="badge" style="background:${STAGE_COLORS[info.status]};font-size:9.5px;padding:2px 7px">${esc(info.status)}</span>
      </div>`;
    }).join("")}
    ${shown.length ? "" : `<div style="color:var(--text2);font-size:14px">Every stage is marked not applicable for this study.</div>`}
    <button class="mini-btn" data-init-edit="${s.id}" style="margin-top:10px">Edit stages &amp; dates${na ? " (" + na + " hidden)" : ""}</button>
    <div class="milestone-row" style="border-top:1px solid var(--line);margin-top:10px;padding-top:12px">
      <button class="task-check ${init.ready ? "done" : ""}" data-init="ready" style="width:24px;height:24px;min-width:24px;border-color:var(--green)"></button>
      <div style="flex:1;font-size:15px;font-weight:800">Study Ready for Enrollment</div>
    </div>`;
}

// ---- Collapsible section framework (Study Detail view) ----
// studySectionState holds open/closed per section id, recomputed fresh (auto-expand if the
// section has content, else collapsed) whenever a *different* study is opened; manual
// expand/collapse toggles are preserved across incidental re-renders of the same study.
// Past Deadlines starts collapsed — it's a reference archive, not something to scroll past
// every time the dashboard opens.
let pastOpen = false;
// Per-meeting open state inside the archive, keyed by meeting id. All closed by default.
let pastMeetingOpen = {};
// Which deadline rows on the board are expanded, keyed by meeting id. <details> keeps its own
// open state in the DOM only, so every render() collapsed everything — including the render that
// happens when you tap a linked project and come back. Opening a meeting is a statement about
// what you're working on, so it survives navigation.
let openDeadlines = {};
// Which sections matter at each phase. A study page carries thirteen sections; only a handful
// are the actual work at any given moment, so the rest recede as the study advances.
// Anything not listed for a phase is "irrelevant" — which never means deleted, and never means
// hidden if it holds anything (see sectionVisibility()).
const PHASE_SECTIONS = {
  "Concept":            ["notes", "tasks", "workingDocs", "deadlines", "abstracts"],
  "Initiation":         ["initiation", "notes", "tasks", "workingDocs", "grant"],
  "Enrolling":          ["enrollment", "notes", "tasks", "workingDocs", "milestones"],
  "Data Collection":    ["enrollment", "workingDocs", "notes", "tasks", "milestones"],
  "Data Extraction":    ["workingDocs", "notes", "tasks", "milestones"],
  "Experiments":        ["workingDocs", "notes", "tasks", "milestones"],
  "Analysis":           ["workingDocs", "authors", "notes", "tasks", "milestones"],
  "Manuscript":         ["docs", "authors", "workingDocs", "abstracts", "notes", "tasks"],
  "Submitted":          ["docs", "authors", "abstracts", "notes", "tasks"],
  "Revisions Required": ["revisionDocs", "docs", "authors", "notes", "tasks"],
  "Published":          ["docs", "abstracts", "authors", "notes"],
  "On Hold":            ["notes", "tasks"]
};
function sectionsForPhase(phase) { return PHASE_SECTIONS[phase] || PHASE_SECTIONS["Concept"]; }
// Every section always stays on the page — this only decides what starts OPEN. Adam was explicit
// that "hiding" meant collapsing, and a section that vanished would be indistinguishable from
// data having been lost.
function sectionOpenForPhase(id, phase) { return sectionsForPhase(phase).indexOf(id) >= 0; }
let studySectionState = {};
let sectionStateForStudy = null;
// A collapsed section that holds something says so, so you don't have to open each one to find
// out where the content is.
function collapsibleSection(id, title, bodyHTML, badge) {
  const open = !!studySectionState[id];
  const hint = (!open && badge) ? `<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text2);font-size:11px;margin-left:6px">${esc(String(badge))}</span>` : "";
  return `
  <div class="section-title" data-sec-toggle="${id}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none">
    <span>${esc(title)}${hint}</span>
    <span data-sec-chev style="font-size:11px;color:var(--text2);display:inline-block;transition:transform .2s;transform:rotate(${open ? 90 : 0}deg)">▸</span>
  </div>
  <div class="card" data-sec-body="${id}" style="${open ? "" : "display:none"}">
    ${bodyHTML}
  </div>`;
}
function bindCollapsibleSections(root) {
  root.querySelectorAll("[data-sec-toggle]").forEach(el => el.onclick = () => {
    const id = el.dataset.secToggle;
    studySectionState[id] = !studySectionState[id];
    const body = root.querySelector(`[data-sec-body="${id}"]`);

function bindAuthorsSection(root, s) {
  const save = (list, msg) => {
    s.authors = list.map(canonName);
    upsertStudy(s);
    if (msg) toast(msg);
  };
  root.querySelectorAll("[data-author-up]").forEach(b => b.onclick = () => {
    const i = +b.dataset.authorUp, list = authorsFor(s);
    if (i <= 0) return;
    [list[i - 1], list[i]] = [list[i], list[i - 1]];
    save(list, `${list[i - 1]} moved up`);
  });
  root.querySelectorAll("[data-author-down]").forEach(b => b.onclick = () => {
    const i = +b.dataset.authorDown, list = authorsFor(s);
    if (i >= list.length - 1) return;
    [list[i + 1], list[i]] = [list[i], list[i + 1]];
    save(list, `${list[i + 1]} moved down`);
  });
  root.querySelectorAll("[data-author-del]").forEach(b => b.onclick = () => {
    const i = +b.dataset.authorDel, list = authorsFor(s);
    const gone = list[i];
    list.splice(i, 1);
    save(list, `${gone} removed from the author list`);
  });
  const add = root.querySelector("#author-add");
  if (add) add.onchange = (e) => {
    if (!e.target.value) return;
    const list = authorsFor(s);
    list.push(canonName(e.target.value));
    save(list, `${canonName(e.target.value)} added as an author`);
  };
  const copy = root.querySelector("#authors-copy");
  if (copy) copy.onclick = async () => {
    const text = authorsFor(s).map(authorName).join(", ");
    if (!text) { toast("No authors to copy"); return; }
    try {
      await navigator.clipboard.writeText(text);
      toast("Author list copied");
    } catch (e) {
      // Clipboard API needs a secure context / permission — fall back to a selectable prompt.
      window.prompt("Copy the author list:", text);
    }
  };
  const reset = root.querySelector("#authors-reset");
  if (reset) reset.onclick = () => {
    delete s.authors;
    upsertStudy(s);
    toast("Author list reset to the project team");
  };
}
function bindLinkFieldRow(root, id, s, key) {
  const el = root.querySelector("#" + id);
  if (!el) return;
  el.onchange = (e) => {
    const val = e.target.value.trim();
    s[key] = val;
    upsertStudy(s);
    toast(val ? "Link saved" : "Link cleared");
  };
}

function renderStudyDetail() {

  const milestones = (s.milestones || []).slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
  const docs = (s.docs || []).filter(dc => dc.category !== "revision").slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const revisionDocs = (s.docs || []).filter(dc => dc.category === "revision").slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const abstracts = (s.abstracts || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const meetingNotes = (s.meetingNotes || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const linkedMeetingsAll = meetingsForStudy(s.id).sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"));
  const linkedAbstractMeetings = linkedMeetingsAll.filter(m => (m.type || "abstract") !== "grant");

    ${linkFieldRow("Revised Manuscript", "wd-revised-ms", s.revisedManuscriptLink)}

  ${collapsibleSection("abstracts", "Abstract Submissions", `
    ${abstracts.length ? abstracts.map(a => `
      <div class="milestone-row">
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:600">${esc(a.meeting)}</div>

    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">

      <button id="abs-add" style="border:none;background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer">Add</button>
    </div>

    <div class="dl-sub" style="margin-top:16px">Abstract Deadlines</div>
    ${linkedAbstractMeetings.length ? linkedAbstractMeetings.map(m => abstractDeadlineRowHTML(m, s)).join("") : `<div style="color:var(--text2);font-size:14px">No linked abstract deadlines.</div>`}
    <div style="margin-top:8px">
      <select id="link-existing-dl-abs" style="width:100%;-webkit-appearance:none;appearance:none;background:var(--bg);border:none;border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none">
        <option value="">＋ Link an existing abstract deadline…</option>
        ${(() => {
          const linkedIds = new Set(linkedMeetingsAll.map(m => m.id));
          const opts = state.meetings.filter(m => !linkedIds.has(m.id) && (m.type || "abstract") !== "grant").sort((a, b) => a.society.localeCompare(b.society) || a.name.localeCompare(b.name));

        <input id="custom-dl-date-abs" type="date" style="${inputStyle};padding:9px 10px;font-size:14px;max-width:135px">
        <button id="custom-dl-add-abs" style="border:none;background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer">Add</button>
      </div>
    </div>
  `, sectionBadge.abstracts)}

  ${collapsibleSection("deadlines", "Grant Deadlines", `
    ${linkedGrantMeetings.length ? linkedGrantMeetings.map(meetingRowHTML).join("") : `<div style="color:var(--text2);font-size:14px">No linked grant deadlines.</div>`}
    <div style="margin-top:8px">
      <select id="link-existing-dl-grant" style="width:100%;-webkit-appearance:none;appearance:none;background:var(--bg);border:none;border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none">
        <option value="">＋ Link an existing grant deadline…</option>
        ${(() => {
          const linkedIds = new Set(linkedMeetingsAll.map(m => m.id));
          const opts = state.meetings.filter(m => !linkedIds.has(m.id) && (m.type || "abstract") === "grant").sort((a, b) => a.society.localeCompare(b.society) || a.name.localeCompare(b.name));
          return opts.map(m => `<option value="${m.id}">${esc(m.society)} — ${esc(m.name)}${m.deadline ? " (" + fmtDate(m.deadline) + ")" : ""}</option>`).join("");
        })()}
      </select>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <input id="custom-dl-name-grant" placeholder="Or type a custom grant deadline…" style="flex:1;min-width:150px;${inputStyle}">
        <input id="custom-dl-date-grant" type="date" style="${inputStyle};padding:9px 10px;font-size:14px;max-width:135px">
        <button id="custom-dl-add-grant" style="border:none;background:var(--blue);color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer">Add</button>
      </div>
    </div>
  `, sectionBadge.deadlines)}

  <!-- Tasks is deliberately not collapsible: it's listed in every phase's relevant set, so it
       would always be open anyway, and it's the thing people come here to act on. -->
  <div class="section-title">Tasks${tasks.filter(t => !t.done).length ? `<span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text2);font-size:11px;margin-left:6px">${tasks.filter(t => !t.done).length} open</span>` : ""}</div>
  <div class="card">
    ${tasks.length ? tasks.map(taskRowHTML).join("") : `<div style="color:var(--text2);font-size:14px">No tasks for this study.</div>`}
    <button class="btn secondary" id="add-task-here" style="margin:12px 0 0 0;padding:10px">+ Add Task</button>
  </div>
  <button class="btn danger" id="del-study-btn">Delete Study</button>`;

  $main.innerHTML = html;
  document.getElementById("back-btn").onclick = () => { detailStudyId = null; render(); };
  document.getElementById("edit-study-btn").onclick = () => openStudyForm(s);
  document.getElementById("del-study-btn").onclick = () => {
    if (blockOfflineEdit("Deleting a study")) return;
    if (confirm(`Delete "${s.title}" and its tasks? This can't be undone.`)) { detailStudyId = null; removeStudy(s.id); toast("Study deleted"); }
  };
  document.getElementById("add-task-here").onclick = () => openTaskForm(null, s.id);
  // Initiation checklist — the stage grid is edited through the same sheet the Worklist board
  // uses, so there's one editor rather than two that can drift apart.
  $main.querySelectorAll("[data-init-edit]").forEach(b => b.onclick = () => openInitiationSheet(b.dataset.initEdit));
  $main.querySelectorAll("[data-init]").forEach(b => b.onclick = () => {
    s.initiation = s.initiation || { sportsSubmission: false, irbApproved: false, caApproved: false, piqBuilt: false, ready: false };
    const k = b.dataset.init;
    s.initiation[k] = !s.initiation[k];
    if (k === "ready" && s.initiation.ready && s.phase === "Initiation") {
      s.phase = nextAfterInit(s);
      upsertStudy(s); toast("Study moved to " + s.phase);
    } else {
      const INIT_LABELS = { sportsSubmission: "Sports submission", irbApproved: "IRB approval", caApproved: "CA approval", piqBuilt: "PIQ", ready: "Ready to enroll" };
      upsertStudy(s);
      toast((INIT_LABELS[k] || "Step") + (s.initiation[k] ? " checked off" : " unchecked"));
    }
  });
  // Abstract deadlines: link existing via dropdown, or add a custom one (type fixed to "abstract")
  document.getElementById("link-existing-dl-abs").onchange = (e) => {
    if (e.target.value) { toggleStudyLink(e.target.value, s.id); toast("Deadline linked"); }
  };
  document.getElementById("custom-dl-add-abs").onclick = () => {
    const name = document.getElementById("custom-dl-name-abs").value.trim();
    if (!name) { toast("Type a deadline name"); return; }
    const m = { id: uid(), society: "Custom", type: "abstract", name,
      deadline: document.getElementById("custom-dl-date-abs").value, dates: "", location: "", link: "",
      aim: "", criteria: "", funded: [], studyIds: [s.id], unconfirmed: false, verifiedOn: "" };
    syncSubmissionTask(m, s.id, true);
    upsertMeeting(m); toast("Custom abstract deadline added");
  };
  // Grant deadlines: link existing via dropdown, or add a custom one (type fixed to "grant")
  document.getElementById("link-existing-dl-grant").onchange = (e) => {
    if (e.target.value) { toggleStudyLink(e.target.value, s.id); toast("Deadline linked"); }
  };
  document.getElementById("custom-dl-add-grant").onclick = () => {
    const name = document.getElementById("custom-dl-name-grant").value.trim();
    if (!name) { toast("Type a deadline name"); return; }
    const m = { id: uid(), society: "Custom", type: "grant", name,
      deadline: document.getElementById("custom-dl-date-grant").value, dates: "", location: "", link: "",
      aim: "", criteria: "", funded: [], studyIds: [s.id], unconfirmed: false, verifiedOn: "" };
    syncSubmissionTask(m, s.id, true);
    upsertMeeting(m); toast("Custom grant deadline added");
  };
  $main.querySelectorAll("[data-open-meeting]").forEach(el => el.onclick = (e) => {
    if (e.target.closest("[data-unlink-meeting], [data-abs-format], [data-abs-link-status], [data-abs-accepted-format]")) return;
    const m = state.meetings.find(x => x.id === el.dataset.openMeeting); if (m) openMeetingForm(m);
  });
  $main.querySelectorAll("[data-unlink-meeting]").forEach(b => b.onclick = (e) => {
    e.stopPropagation(); toggleStudyLink(b.dataset.unlinkMeeting, s.id); toast("Unlinked");
  });
  // Linked abstract deadlines: poster/podium format, submission status, and (once accepted) the granted format
  $main.querySelectorAll("[data-abs-format]").forEach(el => el.onchange = (e) => {
    e.stopPropagation();
    setAbstractLinkField(s, el.dataset.absFormat, "format", e.target.value);
    toast(e.target.value ? "Submitting as " + e.target.value : "Format cleared");
  });
  $main.querySelectorAll("[data-abs-link-status]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const meetingId = b.dataset.absLinkStatus;
    const current = abstractLinkInfo(s, meetingId).status;
    const next = ABS_LINK_STATUSES[(ABS_LINK_STATUSES.indexOf(current) + 1) % ABS_LINK_STATUSES.length];
    setAbstractLinkField(s, meetingId, "status", next);
    const mtg = state.meetings.find(x => x.id === meetingId);
    toast(`${mtg ? mtg.name + " — " : ""}${next}`);
  });
  $main.querySelectorAll("[data-abs-accepted-format]").forEach(el => el.onchange = (e) => {
    e.stopPropagation();
    setAbstractLinkField(s, el.dataset.absAcceptedFormat, "acceptedFormat", e.target.value);
    toast(e.target.value ? "Accepted as " + e.target.value : "Accepted format cleared");
  });
  document.getElementById("ms-add").onclick = () => {
    const name = document.getElementById("ms-name").value.trim();
    const date = document.getElementById("ms-date").value;
    if (!name) return;
    s.milestones = s.milestones || [];
    s.milestones.push({ name, date, done: false });
    upsertStudy(s); toast("Milestone added");
  };
  $main.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => {
    const m = milestones[+b.dataset.ms];
    m.done = !m.done; upsertStudy(s);
    toast(m.done ? `"${m.name}" done` : `"${m.name}" reopened`);
  });
  $main.querySelectorAll("[data-ms-del]").forEach(b => b.onclick = () => {
    const m = milestones[+b.dataset.msDel];
    s.milestones = (s.milestones || []).filter(x => x !== m);
    upsertStudy(s);
    toast("Milestone removed");
  });

  // Documents
  document.getElementById("doc-upload").onclick = () => document.getElementById("doc-file").click();
  document.getElementById("doc-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const maxMB = sb ? 8 : 2.5;
    if (f.size > maxMB * 1024 * 1024) { toast(`File too large (max ${maxMB} MB${sb ? "" : " until Team Sync is on"})`); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const id = uid();
      if (!sb) {
        try { localStorage.setItem("rt-file-" + id, reader.result); }
        catch (err) { toast("Device storage full — connect Team Sync for file space"); return; }
      } else {
        try { localStorage.setItem("rt-file-" + id, reader.result); } catch (err) {}
        const { error } = await sb.from("items").upsert({ id, kind: "file", data: { name: f.name, content: reader.result }, updated_at: new Date().toISOString() });
        if (error) { toast("Upload failed — check connection"); localStorage.removeItem("rt-file-" + id); return; }
      }
      const label = document.getElementById("doc-label").value.trim();
      s.docs = s.docs || [];
      s.docs.push({ id, name: f.name, label, by: me(), date: todayStr(), size: f.size });
      upsertStudy(s);
      toast("Document uploaded");
    };
    reader.readAsDataURL(f);
  };
  $main.querySelectorAll("[data-doc]").forEach(el => el.onclick = () => {
    const dc = (s.docs || []).find(x => x.id === el.dataset.doc);
    if (dc) downloadDoc(dc);
  });
  $main.querySelectorAll("[data-doc-del]").forEach(b => b.onclick = () => {
    const dc = (s.docs || []).find(x => x.id === b.dataset.docDel);
    if (!dc || !confirm(`Delete "${dc.name}"? All team copies are removed.`)) return;
    s.docs = s.docs.filter(x => x.id !== dc.id);
    localStorage.removeItem("rt-file-" + dc.id);
    deleteRemote(dc.id);
    upsertStudy(s);
    toast("Document deleted");
  });

  // Revision documents (uploaded file tagged category:"revision", plus link fields)
  document.getElementById("revdoc-upload").onclick = () => document.getElementById("revdoc-file").click();
  document.getElementById("revdoc-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const maxMB = sb ? 8 : 2.5;
    if (f.size > maxMB * 1024 * 1024) { toast(`File too large (max ${maxMB} MB${sb ? "" : " until Team Sync is on"})`); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const id = uid();
      if (!sb) {
        try { localStorage.setItem("rt-file-" + id, reader.result); }
        catch (err) { toast("Device storage full — connect Team Sync for file space"); return; }
      } else {
        try { localStorage.setItem("rt-file-" + id, reader.result); } catch (err) {}
        const { error } = await sb.from("items").upsert({ id, kind: "file", data: { name: f.name, content: reader.result }, updated_at: new Date().toISOString() });
        if (error) { toast("Upload failed — check connection"); localStorage.removeItem("rt-file-" + id); return; }
      }
      const label = document.getElementById("revdoc-label").value.trim();
      s.docs = s.docs || [];
      s.docs.push({ id, name: f.name, label, by: me(), date: todayStr(), size: f.size, category: "revision" });
      upsertStudy(s);
      toast("Revision comments uploaded");
    };
    reader.readAsDataURL(f);
  };
  bindLinkFieldRow($main, "wd-revised-ms", s, "revisedManuscriptLink");
  bindLinkFieldRow($main, "wd-response", s, "responseToReviewersLink");

  // Working documents (link fields)
  bindLinkFieldRow($main, "wd-abstract", s, "workingAbstractLink");
  bindLinkFieldRow($main, "wd-overview", s, "projectOverviewLink");
  bindLinkFieldRow($main, "wd-manuscript", s, "workingManuscriptLink");
  bindLinkFieldRow($main, "wd-sheet", s, "dataCollectionSheetLink");
  bindLinkFieldRow($main, "wd-process", s, "dataProcessDocLink");
  bindLinkFieldRow($main, "wd-tracking", s, "trackingSheetLink");

  // Study notes. Each handler gates on blockOfflineEdit BEFORE mutating `s` — upsertStudy
  // gates too, but by then the in-memory study would already be dirty with a change that
  // never got saved.
  const noteAddBtn = document.getElementById("note-add");
  if (noteAddBtn) noteAddBtn.onclick = () => {
    const text = document.getElementById("note-text").value.trim();
    if (!text) { toast("Type something first"); return; }
    if (blockOfflineEdit("Adding a note")) return;
    s.noteEntries = s.noteEntries || [];
    s.noteEntries.push({ id: uid(), text, date: document.getElementById("note-date").value || todayStr(), archivedOn: "" });
    studySectionState.notes = true;
    upsertStudy(s);
    toast("Note added");
  };
  $main.querySelectorAll("[data-note-arch]").forEach(b => b.onclick = () => {
    const n = (s.noteEntries || []).find(x => x.id === b.dataset.noteArch);
    if (!n || blockOfflineEdit("Archiving a note")) return;
    const stamp = todayStr();
    n.archivedOn = stamp;
    openNoteArchives[stamp] = true;   // leave the group open so it's obvious where it went
    upsertStudy(s);
    toast("Archived — it's under Archived · " + fmtDate(stamp) + " below");
  });
  const noteArchiveAll = document.getElementById("note-archive-all");
  if (noteArchiveAll) noteArchiveAll.onclick = () => {
    if (blockOfflineEdit("Archiving notes")) return;
    const clearing = (s.noteEntries || []).filter(x => !x.archivedOn);
    if (!clearing.length) return;
    const stamp = todayStr();
    clearing.forEach(x => x.archivedOn = stamp);
    openNoteArchives[stamp] = false;  // collapsed — clearing the desk is the whole point
    upsertStudy(s);
    toast(clearing.length + " note" + (clearing.length === 1 ? "" : "s") + " archived — tap Archived · " + fmtDate(stamp) + " to read them again");
  };
  $main.querySelectorAll("[data-note-unarch]").forEach(b => b.onclick = () => {
    const n = (s.noteEntries || []).find(x => x.id === b.dataset.noteUnarch);
    if (!n || blockOfflineEdit("Restoring a note")) return;
    n.archivedOn = "";
    upsertStudy(s);
    toast("Note moved back up to the live list");
  });
  $main.querySelectorAll("[data-note-del]").forEach(b => b.onclick = () => {
    const n = (s.noteEntries || []).find(x => x.id === b.dataset.noteDel);
    if (!n) return;
    if (!confirm("Delete this note for good? Archiving keeps it — deleting doesn't.")) return;
    if (blockOfflineEdit("Deleting a note")) return;
    s.noteEntries = s.noteEntries.filter(x => x.id !== n.id);
    upsertStudy(s);
    toast("Note deleted");
  });
  // Expanding an archive group is view state only, so no sync gate and no re-render.
  $main.querySelectorAll("[data-note-group]").forEach(el => el.onclick = () => {
    const d = el.dataset.noteGroup;
    openNoteArchives[d] = !openNoteArchives[d];
    const body = $main.querySelector(`[data-note-group-body="${d}"]`);
    if (body) body.style.display = openNoteArchives[d] ? "" : "none";
    const chev = el.querySelector("[data-note-group-chev]");
    if (chev) chev.style.transform = `rotate(${openNoteArchives[d] ? 90 : 0}deg)`;
  });

  // Meeting notes (repeatable list, linked to this study)
  document.getElementById("mnote-add").onclick = () => {
    const label = document.getElementById("mnote-label").value.trim();
    const link = document.getElementById("mnote-link").value.trim();
    const date = document.getElementById("mnote-date").value;
    if (!link) { toast("Paste a link to the notes"); return; }
    s.meetingNotes = s.meetingNotes || [];
    s.meetingNotes.push({ id: uid(), label, link, date });
    upsertStudy(s);
    toast("Meeting notes added");
  };
  $main.querySelectorAll("[data-mnote-del]").forEach(b => b.onclick = () => {
    const n = (s.meetingNotes || []).find(x => x.id === b.dataset.mnoteDel);
    if (!n) return;
    s.meetingNotes = s.meetingNotes.filter(x => x.id !== n.id);
    upsertStudy(s);
    toast("Removed");
  });

  // Abstracts
  document.getElementById("abs-add").onclick = () => {
    const meeting = document.getElementById("abs-meeting").value.trim();
    if (!meeting) { toast("Enter the meeting name"); return; }
    s.abstracts = s.abstracts || [];
    s.abstracts.push({ id: uid(), meeting, date: document.getElementById("abs-date").value, status: "Submitted" });
    upsertStudy(s);
    toast("Abstract added");
  };
  $main.querySelectorAll("[data-abs-status]").forEach(b => b.onclick = () => {
    const a = (s.abstracts || []).find(x => x.id === b.dataset.absStatus);
    if (!a) return;
    a.status = ABS_STATUSES[(ABS_STATUSES.indexOf(a.status) + 1) % ABS_STATUSES.length];
    upsertStudy(s);
    toast(`${a.meeting} — ${a.status}`);
  });
  $main.querySelectorAll("[data-abs-del]").forEach(b => b.onclick = () => {
    const a = (s.abstracts || []).find(x => x.id === b.dataset.absDel);
    if (!a || !confirm(`Remove "${a.meeting}" from abstract history?`)) return;
    s.abstracts = s.abstracts.filter(x => x.id !== a.id);
    upsertStudy(s);
    toast("Abstract removed from history");
  });

  bindAuthorsSection($main, s);
  bindTaskRows();
  bindCollapsibleSections($main);
}

function taskRowHTML(t) {
  const s = t.studyId ? studyById(t.studyId) : null;
  const linkedMeeting = t.linkedMeetingId ? state.meetings.find(m => m.id === t.linkedMeetingId) : null;

/* ============ Working Study List (spreadsheet view) ============ */
// Three-way: "active" (the default working set), "going" (only stale + rotten, so the board
// becomes a to-chase list), "all" (includes Published and On Hold). Kept as a string rather than
// a pair of booleans so the three states can't contradict each other.
let worklistStatus = "active";
let worklistSort = { key: null, dir: 1 };
let worklistSearchQuery = "";
// Worklist keeps its OWN filter state (Adam's call): you can have Studies on your own
// projects while the Worklist shows the whole lab.
// "table" is the spreadsheet everyone knows; the other two are purpose-built boards offered in
// the same View dropdown as saved filter sets.
let worklistLayout = "table";
let worklistPerson = "mine";
let worklistPhaseFilter = "All phases";
let worklistDesignFilter = "All designs";

// ---------- Saved filter sets ----------
// Shared by org-chart team rather than per person: a surgeon and the students reporting to
// them should see the same saved views. "Team" = the subtree of your top-most non-root
// ancestor, so each surgeon under Adam forms one team and Adam (a root) sees everything.
function teamRootOf(userId) {
  let cur = profileFor(userId);
  if (!cur) return "";
  const guard = {};
  while (cur && cur.reportsTo && profileFor(cur.reportsTo) && !guard[cur.id]) {
    guard[cur.id] = true;
    const parent = profileFor(cur.reportsTo);
    // Once the parent is a root, WE are the top-most non-root ancestor — so the team is our
    // own subtree, not the root's. Returning the root here would collapse every team into one.
    if (!parent.reportsTo || !profileFor(parent.reportsTo)) return cur.id;
    cur = parent;
  }

}
function myTeamRoot() { return currentUser ? teamRootOf(currentUser.id) : ""; }

}
function visibleFilterSets(tab) {
  const root = myTeamRoot();
  return (state.filterSets || [])
    .filter(f => f.tab === tab)
    // A root of the chart (and anyone with no reporting data yet) sees every set rather than
    // being locked out of views their own team created.
    .filter(f => amRootOfChart() || !root || !f.teamRoot || f.teamRoot === root)
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
}
function currentFilters(tab) {
  return tab === "worklist"
    ? { status: worklistStatus === "all" ? "All" : worklistStatus === "going" ? "Stale and Rotten" : "Active", person: worklistPerson, phase: worklistPhaseFilter, design: worklistDesignFilter, search: worklistSearchQuery }
    : { status: studyFilter, person: personFilter, phase: studyPhaseFilter, design: studyDesignFilter, search: studySearchQuery };
}

    worklistPerson = f.person || "mine";
    worklistPhaseFilter = f.phase || "All phases";
    worklistDesignFilter = f.design || "All designs";
    worklistSearchQuery = f.search || "";
  } else {
    studyFilter = f.status || "Active";
    personFilter = f.person || "mine";
    studyPhaseFilter = f.phase || "All phases";
    studyDesignFilter = f.design || "All designs";
    studySearchQuery = f.search || "";

}
function saveFilterSet(tab, name) {
  if (!currentUser) { toast("Sign in first"); return; }
  const existing = (state.filterSets || []).find(f => f.tab === tab && (f.name || "").toLowerCase() === name.toLowerCase() && (amRootOfChart() || f.teamRoot === myTeamRoot()));
  const rec = existing || { id: uid(), tab, name, ownerId: currentUser.id };
  rec.name = name;
  rec.ownerName = me();
  rec.teamRoot = myTeamRoot();
  rec.filters = currentFilters(tab);
  state.filterSets = state.filterSets || [];

              <div style="font-size:15px;font-weight:700;cursor:pointer" data-open-study="${s.id}">${esc(s.nickname || s.title)}</div>
              <div style="font-size:11.5px;color:var(--text2)">${esc(s.irb || "no IRB #")}${s.pi ? " · PI " + esc(s.pi) : ""}</div>
            </div>
            <button class="mini-btn" data-fu-edit="${s.id}" style="margin:0;flex:0 0 auto">Follow-up</button>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px">
            <div style="font-size:22px;font-weight:800">${isNaN(cur) ? "—" : cur}<span style="font-size:14px;color:var(--text2);font-weight:600"> / ${isNaN(tgt) ? "—" : tgt}</span></div>
            <div style="font-size:12.5px;color:var(--text2);font-weight:600">${pct === null ? "set a target in Edit Study" : pct + "% of IRB target"}</div>
          </div>
          ${tgt > 0 ? `<div class="progressbar" style="margin-top:6px;height:7px"><div style="width:${pct}%;background:${pct >= 100 ? "var(--green)" : "var(--blue)"}"></div></div>` : ""}
          ${fu.rows.length ? `
            <div style="margin-top:10px;border-top:0.5px solid var(--line);padding-top:8px">
              <div style="font-size:11.5px;color:var(--text2);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px">Follow-up ${fu.pct !== null ? "· " + fu.pct + "% complete" : ""}</div>
              ${fu.rows.map(r => {
                const due = Number(r.due) || 0, done = Number(r.done) || 0;
                const p = due > 0 ? Math.round(100 * done / due) : null;
                const behind = p !== null && p < 80;
                return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0">
                  <span>${esc(r.label || "Timepoint")}</span>
                  <span style="color:${behind ? "var(--orange)" : "var(--text2)"}">${done} / ${due}${p === null ? "" : " · " + p + "%"}</span>
                </div>`;
              }).join("")}
            </div>` : `<div style="font-size:12.5px;color:var(--text2);margin-top:8px">No follow-up timepoints recorded — tap Follow-up to add them.</div>`}
        </div>`;
      }).join("");
      html += `<div style="font-size:12px;color:var(--text2);line-height:1.5;margin:0 2px 8px 2px">Follow-up is tracked as counts per timepoint, not per patient — no subject-level data is stored here. Anything below 80% complete is flagged.</div>`;
    }
    $main.innerHTML = html;
    $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { worklistStatus = b.dataset.wl;
      // Entering the tab sorts worst-first automatically; column headers still override it, and
      // leaving the tab drops the hidden sort so the other views aren't left ordered by a column
      // they don't show.
      if (worklistStatus === "going") worklistSort = { key: "stale", dir: -1 };
      else if (worklistSort.key === "stale") worklistSort = { key: null, dir: 1 };
      render(); });
    bindSearchBox("worklist-search", (v) => { worklistSearchQuery = v; });
    bindWorklistFilters();
    $main.querySelectorAll("[data-fu-edit]").forEach(b => b.onclick = () => openFollowUpSheet(b.dataset.fuEdit));
    $main.querySelectorAll("[data-open-study]").forEach(el => el.onclick = () => { openStudy(el.dataset.openStudy); render(); });
    return;
  }

  if (!studies.length) {
    html += worklistSearchQuery
      ? `<div class="empty"><div class="big">🔍</div>No studies match "${esc(worklistSearchQuery)}".</div>`
      : (worklistStatus === "going"
        ? `<div class="empty"><div class="big">✅</div>Nothing is stale or rotten.<br><span style="font-size:13px">Every active study has been touched in the last ${STALE_DAYS} days.</span></div>`
        : `<div class="empty"><div class="big">▦</div>No ${worklistStatus === "all" ? "" : "active "}studies yet.<br>Tap <b>+</b> to add one.</div>`);
    $main.innerHTML = html;
    $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { worklistStatus = b.dataset.wl;
      // Entering the tab sorts worst-first automatically; column headers still override it, and
      // leaving the tab drops the hidden sort so the other views aren't left ordered by a column
      // they don't show.
      if (worklistStatus === "going") worklistSort = { key: "stale", dir: -1 };
      else if (worklistSort.key === "stale") worklistSort = { key: null, dir: 1 };
      render(); });
    bindSearchBox("worklist-search", (v) => { worklistSearchQuery = v; });
    bindWorklistFilters();
    return;
  }

  const enrollCell = (s) => {
    const hasAny = (s.enrollCurrent !== "" && s.enrollCurrent != null) || (s.enrollTarget !== "" && s.enrollTarget != null);
    if (!hasAny) return `<span style="color:var(--text2)">—</span>`;
    const cur = (s.enrollCurrent === "" || s.enrollCurrent == null) ? "—" : s.enrollCurrent;
    const tgt = (s.enrollTarget === "" || s.enrollTarget == null) ? "—" : s.enrollTarget;
    return `${esc(String(cur))} / ${esc(String(tgt))}`;
  };
  const stepsCell = (s) => {
    const open = state.tasks.filter(t => t.studyId === s.id && !t.done)
      .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    if (!open.length) return `<span class="none">No open tasks</span>`;
    return `<ul>` + open.slice(0, 5).map(t =>
      `<li>${esc(t.title)}${t.due ? ` <span class="${dueClass(t.due)}" style="font-size:11px">(${fmtDate(t.due)})</span>` : ""}</li>`).join("")
      + (open.length > 5 ? `<li class="none">+${open.length - 5} more</li>` : "") + `</ul>`;
  };

  // The tag rides next to the nickname rather than in its own column, so it stays visible without
  // sideways scrolling — the point of it is to be impossible to miss.
  const rotCell = (s) => {
    const f = freshness(s);
    if (!f) return "";
    if (f.level === "fresh") {
      // Show the age from a week out, so the slide towards stale is visible and "nothing is
      // rotten" can be read as a fact rather than taken on trust. Under a week stays clean.
      return f.days >= 7
        ? `<div style="margin-top:3px;font-size:10.5px;color:var(--text2)">quiet ${f.days}d</div>`
        : "";
    }
    if (f.level === "rotten") {
      return `<div style="margin-top:3px"><span class="rot-tag rotten" title="${esc(f.note)}">ROTTEN · ${f.days}d</span><span class="stink" aria-hidden="true"><span>〜</span><span>〜</span><span>〜</span></span></div>`;
    }
    return `<div style="margin-top:3px"><span class="rot-tag stale" title="${esc(f.note)}">STALE · ${f.days}d</span></div>`;
  };
  const rows = studies.map(s => {
    const f = freshness(s);
    const rotClass = (f && f.level === "rotten") ? " class=\"wl-rotten\""
      : (f && f.level === "stale") ? " class=\"wl-stale\"" : "";
    return `
    <tr data-open-study="${s.id}"${rotClass}>
      <td>${s.irb ? esc(s.irb) : `<span style="color:var(--text2)">—</span>`}</td>
      <td><span class="wl-pill" style="background:${IRB_STATUS_COLORS[s.irbStatus] || "var(--text2)"}">${esc(s.irbStatus || "—")}</span></td>
      <td>${enrollCell(s)}</td>
      <td class="wl-title">${esc(s.title)}</td>
      <td class="wl-name">${esc(s.nickname || "—")}${rotCell(s)}</td>
      <td><span class="badge outline" style="font-size:11px">${esc(DESIGN_SHORT[s.design] || "—")}</span></td>
      <td><span class="wl-pill" style="background:${PHASE_COLORS[s.phase] || "var(--text2)"}">${esc(s.phase)}</span></td>
      <td class="wl-steps">${stepsCell(s)}</td>
    </tr>`;
  }).join("");

  const sortArrow = (key) => worklistSort.key === key ? (worklistSort.dir === 1 ? " ▲" : " ▼") : "";
  // The segment button has to fit a third of the width on a phone, so it's abbreviated there and
  // the full name lives here, where there's room for it.
  if (worklistStatus === "going") {
    html += `<div class="section-title" style="margin-top:0">Stale and Rotten Studies</div>
      <div style="font-size:12.5px;color:var(--text2);line-height:1.5;margin:0 2px 10px 2px">Longest-neglected first. Untouched for ${STALE_DAYS} days is stale; ${ROTTEN_DAYS} days and it's rotten.</div>`;
  }
  html += `<div class="wl-wrap"><table class="wl">
      <thead><tr>${cols.map(c => `<th data-sort="${c.key}" style="cursor:pointer;user-select:none;white-space:nowrap">${esc(c.label)}${sortArrow(c.key)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-size:12px;color:var(--text2);line-height:1.5;margin:0 2px 8px 2px">Swipe sideways to see all columns. Tap a column header to sort, tap a row to open the study. Next steps are the study's open tasks (soonest due first).${(() => {
      const rot = studies.filter(x => { const f = freshness(x); return f && f.level === "rotten"; }).length;
      const st = studies.filter(x => { const f = freshness(x); return f && f.level === "stale"; }).length;
      if (!rot && !st) return " Nothing on this list has gone off — everything's been touched in the last two weeks.";
      const bits = [];
      if (rot) bits.push(`<b>${rot} rotten</b> (nothing for ${ROTTEN_DAYS}+ days)`);
      if (st) bits.push(`${st} stale (${STALE_DAYS}+ days)`);
      return ` ${bits.join(" and ")}. On Hold and Published studies are exempt — parked on purpose isn't the same as forgotten.`;
    })()}</div>`;

  $main.innerHTML = html;
  $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { worklistStatus = b.dataset.wl;
      // Entering the tab sorts worst-first automatically; column headers still override it, and
      // leaving the tab drops the hidden sort so the other views aren't left ordered by a column
      // they don't show.
      if (worklistStatus === "going") worklistSort = { key: "stale", dir: -1 };
      else if (worklistSort.key === "stale") worklistSort = { key: null, dir: 1 };
      render(); });
  bindSearchBox("worklist-search", (v) => { worklistSearchQuery = v; });
  bindWorklistFilters();
  $main.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const key = th.dataset.sort;
    if (worklistSort.key === key) worklistSort.dir *= -1;
    else { worklistSort.key = key; worklistSort.dir = 1; }
    render();
  });
  $main.querySelectorAll("[data-open-study]").forEach(el => el.onclick = () => {
    openStudy(el.dataset.openStudy); tab = "studies"; render();
  });
}

/* ============ Meeting Notes (weekly, all-studies) ============ */
function renderTeamNotes() {
  $title.textContent = "Meeting Notes";
  const notes = (state.teamNotes || []).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const inputStyle = "border:none;background:var(--bg);border-radius:8px;padding:9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none";
  let html = `<div style="font-size:13px;color:var(--text2);line-height:1.5;margin:0 4px 14px 4px">Drop a link here each week after your team goes through every study on the tracker.</div>`;
  html += `<div class="card">`;
  html += notes.length ? notes.map(n => `
      <div class="milestone-row">
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:600">${esc(n.label || "Meeting Notes")}</div>
          ${n.date ? `<div style="font-size:12px;color:var(--text2)">${fmtDate(n.date)}</div>` : ""}
        </div>
        ${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;padding:8px 4px">Open ↗</a>` : ""}
        <button data-note-del="${n.id}" style="border:none;background:none;color:var(--text2);font-size:18px;cursor:pointer">×</button>
      </div>`).join("") : `<div style="color:var(--text2);font-size:14px">No meeting notes logged yet.</div>`;
  html += `
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <input id="note-label" placeholder="e.g. Weekly Research Meeting" style="flex:1;min-width:150px;${inputStyle}">
      <input id="note-date" type="date" value="${esc(todayStr())}" style="${inputStyle};padding:9px 10px;font-size:14px;max-width:135px">
    </div>
    <div style="margin-top:8px">
      <input id="note-link" placeholder="Paste link to the meeting notes…" style="width:100%;box-sizing:border-box;${inputStyle}">
    </div>
    <button id="note-add" class="btn" style="margin-top:10px;width:100%">Add Meeting Notes</button>
  </div>`;
  $main.innerHTML = html;
  document.getElementById("note-add").onclick = () => {
    const label = document.getElementById("note-label").value.trim();
    const link = document.getElementById("note-link").value.trim();
    const date = document.getElementById("note-date").value;
    if (!link) { toast("Paste a link to the notes"); return; }
    upsertTeamNote({ id: uid(), label, link, date });
    toast("Meeting notes added");
  };
  $main.querySelectorAll("[data-note-del]").forEach(b => b.onclick = () => {
    const n = notes.find(x => x.id === b.dataset.noteDel);
    if (!n || !confirm(`Remove "${n.label || "these meeting notes"}"?`)) return;
    removeTeamNote(n.id);
    toast("Removed");
  });
}

  // ---------- Merge duplicate names ----------
