// ---- Collapsible section framework (Study Detail view) ----
// studySectionState holds open/closed per section id, recomputed fresh (auto-expand if the
// section has content, else collapsed) whenever a *different* study is opened; manual
// expand/collapse toggles are preserved across incidental re-renders of the same study.
let studySectionState = {};
let sectionStateForStudy = null;
function collapsibleSection(id, title, bodyHTML) {
  const open = !!studySectionState[id];
  return `
  <div class="section-title" data-sec-toggle="${id}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none">
    <span>${esc(title)}</span>
    <span data-sec-chev style="font-size:11px;color:var(--text2);display:inline-block;transition:transform .2s;transform:rotate(${open ? 90 : 0}deg)">▸</span>
  </div>
  <div class="card" data-sec-body="${id}" style="${open ? "" : "display:none"}">
    ${bodyHTML}
  </div>`;
}
function bindCollapsibleSections(root) {
  root.querySelectorAll("[data-sec-toggle]").forEach(el => el.onclick = () => {
    const id = el.dataset.secToggle;
    studySectionState[id] = !studySectionState[id];
    const body = root.querySelector(`[data-sec-body="${id}"]`);
    if (body) body.style.display = studySectionState[id] ? "" : "none";
    const chev = el.querySelector("[data-sec-chev]");
    if (chev) chev.style.transform = `rotate(${studySectionState[id] ? 90 : 0}deg)`;
  });
}

// Per-study submission tracking for a linked abstract deadline: what format was submitted
// (poster/podium), the review status, and — once accepted — which format was granted.
function abstractLinkInfo(s, meetingId) {
  return (s.abstractDeadlineInfo && s.abstractDeadlineInfo[meetingId]) || { format: "", status: "Not Submitted", acceptedFormat: "" };
}
function setAbstractLinkField(s, meetingId, field, value) {
  s.abstractDeadlineInfo = s.abstractDeadlineInfo || {};
  s.abstractDeadlineInfo[meetingId] = Object.assign({ format: "", status: "Not Submitted", acceptedFormat: "" }, s.abstractDeadlineInfo[meetingId], { [field]: value });
  upsertStudy(s);
}
// Row for a linked abstract deadline on a study's detail page — adds the poster/podium
// question, a submitted/rejected/accepted status badge, and (once accepted) the granted format.
function abstractDeadlineRowHTML(m, s) {
  const info = abstractLinkInfo(s, m.id);
  const dl = m.deadline ? daysUntil(m.deadline) : null;
  const col = dl == null ? "var(--text2)" : dl < 0 ? "var(--text2)" : dl <= 7 ? "var(--red)" : dl <= 30 ? "var(--orange)" : "var(--green)";
  return `<div class="task-row" style="padding:8px 0;align-items:flex-start" data-open-meeting="${m.id}">
    <div style="min-width:50px;text-align:center"><div style="font-size:18px;font-weight:800;color:${col}">${m.deadline && dl >= 0 ? dl : "—"}</div><div style="font-size:9px;color:var(--text2);font-weight:700">${m.deadline && dl >= 0 ? "DAYS" : ""}</div></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600"><span class="badge" style="background:var(--indigo);font-size:9.5px;padding:2px 6px;margin-right:5px">${esc(m.society)}</span>${esc(m.name)}</div>
      <div style="font-size:12px;color:var(--text2)">${m.deadline ? "Abstract due " + fmtDate(m.deadline) : ""}</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <select data-abs-format="${m.id}" style="border:none;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none">
          <option value="" ${!info.format ? "selected" : ""}>Poster or podium?</option>
          ${ABS_SUBMIT_FORMATS.map(f => `<option value="${f}" ${info.format === f ? "selected" : ""}>${f}</option>`).join("")}
        </select>
        <button class="badge" data-abs-link-status="${m.id}" style="background:${ABS_LINK_STATUS_COLORS[info.status] || "var(--text2)"};border:none;cursor:pointer;font-family:inherit" title="Tap to change status">${esc(info.status)}</button>
        ${info.status === "Accepted" ? `
        <select data-abs-accepted-format="${m.id}" style="border:none;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);outline:none">
          <option value="" ${!info.acceptedFormat ? "selected" : ""}>Accepted as…</option>
          ${ABS_ACCEPTED_FORMATS.map(f => `<option value="${f}" ${info.acceptedFormat === f ? "selected" : ""}>${f}</option>`).join("")}

// One row for a linked grant deadline, used on a study's detail page.
function meetingRowHTML(m) {

function linkFieldRow(label, id, value) {

  $main.innerHTML = html;

  document.getElementById("revdoc-upload").onclick = () => document.getElementById("revdoc-file").click();
  document.getElementById("revdoc-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const maxMB = sb ? 8 : 2.5;
    if (f.size > maxMB * 1024 * 1024) { toast(`File too large (max ${maxMB} MB${sb ? "" : " until Team Sync is on"})`); return; }

    reader.onload = async () => {

        try { localStorage.setItem("rt-file-" + id, reader.result); }

        try { localStorage.setItem("rt-file-" + id, reader.result); } catch (err) {}

      s.docs.push({ id, name: f.name, label, by: me(), date: todayStr(), size: f.size, category: "revision" });

      toast("Revision comments uploaded");

  };
  bindLinkFieldRow($main, "wd-revised-ms", s, "revisedManuscriptLink");
  bindLinkFieldRow($main, "wd-response", s, "responseToReviewersLink");

  // Working documents (link fields)
  bindLinkFieldRow($main, "wd-abstract", s, "workingAbstractLink");
  bindLinkFieldRow($main, "wd-overview", s, "projectOverviewLink");
  bindLinkFieldRow($main, "wd-manuscript", s, "workingManuscriptLink");
  bindLinkFieldRow($main, "wd-sheet", s, "dataCollectionSheetLink");
  bindLinkFieldRow($main, "wd-process", s, "dataProcessDocLink");
  bindLinkFieldRow($main, "wd-tracking", s, "trackingSheetLink");

  // Meeting notes (repeatable list, linked to this study)
  document.getElementById("mnote-add").onclick = () => {
    const label = document.getElementById("mnote-label").value.trim();

  $main.querySelectorAll("[data-mnote-del]").forEach(b => b.onclick = () => {

    s.meetingNotes = s.meetingNotes.filter(x => x.id !== n.id);

    toast("Removed");

  // Abstracts
  document.getElementById("abs-add").onclick = () => {
    const meeting = document.getElementById("abs-meeting").value.trim();
    if (!meeting) { toast("Enter the meeting name"); return; }
    s.abstracts = s.abstracts || [];

    toast("Abstract added");

  $main.querySelectorAll("[data-abs-status]").forEach(b => b.onclick = () => {
    const a = (s.abstracts || []).find(x => x.id === b.dataset.absStatus);

    a.status = ABS_STATUSES[(ABS_STATUSES.indexOf(a.status) + 1) % ABS_STATUSES.length];

  $main.querySelectorAll("[data-abs-del]").forEach(b => b.onclick = () => {

function taskRowHTML(t) {
  const s = t.studyId ? studyById(t.studyId) : null;
  const linkedMeeting = t.linkedMeetingId ? state.meetings.find(m => m.id === t.linkedMeetingId) : null;
  const meta = [];
  if (t.due) meta.push(`<span class="${t.done ? "" : dueClass(t.due)}">${dueLabel(t.due)}</span>`);
  if ((t.assignees || []).length) meta.push(esc(t.assignees.join(", ")));
  if (s && tab !== "studies") meta.push(`<span data-goto-study="${s.id}" style="text-decoration:underline;text-underline-offset:2px;cursor:pointer">${esc(s.title)} ›</span>`);
  if (linkedMeeting) meta.push(`<span data-goto-meeting="${linkedMeeting.id}" style="text-decoration:underline;text-underline-offset:2px;cursor:pointer">${(linkedMeeting.type || "abstract") === "grant" ? "Grant" : "Abstract"} deadline ›</span>`);
  return `
  <div class="task-row">
    <button class="task-check ${t.done ? "done" : ""}" data-toggle="${t.id}" aria-label="toggle"></button>
    <div class="task-body ${t.done ? "done" : ""}" data-task="${t.id}">
      <div class="t-title">${esc(t.title)}</div>
      ${meta.length ? `<div class="t-meta">${meta.join(" · ")}</div>` : ""}
    </div>
  </div>`;
}
function bindTaskRows(root) {
  root = root || $main;
  root.querySelectorAll("[data-toggle]").forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const t = state.tasks.find(x => x.id === b.dataset.toggle);
    if (t) { t.done = !t.done; upsertTask(t); }
  });
  root.querySelectorAll("[data-goto-study]").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    openStudy(el.dataset.gotoStudy); tab = "studies"; render();
  });
  root.querySelectorAll("[data-goto-meeting]").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const m = state.meetings.find(x => x.id === el.dataset.gotoMeeting);
    if (m) openMeetingForm(m);
  });
  root.querySelectorAll("[data-task]").forEach(el => el.onclick = () => {
    const t = state.tasks.find(x => x.id === el.dataset.task);
    if (t) openTaskForm(t);
  });
}

function renderTasks() {
  $title.textContent = "Tasks";
  const filters = ["Open", "Mine", "Overdue", "Done", "All"];
  const myName = me().toLowerCase();
  let list = state.tasks.slice();
  if (taskFilter === "Open") list = list.filter(t => !t.done);
  else if (taskFilter === "Mine") list = list.filter(t => !t.done && myName && (t.assignees || []).some(a => (a || "").toLowerCase() === myName));
  else if (taskFilter === "Overdue") list = list.filter(t => !t.done && t.due && t.due < todayStr());
  else if (taskFilter === "Done") list = list.filter(t => t.done);
  list.sort((a, b) => (a.done - b.done) || (a.due || "9999").localeCompare(b.due || "9999"));

  let html = `<div class="seg">` + filters.map(f =>
    `<button class="${f === taskFilter ? "active" : ""}" data-filter="${f}">${f}</button>`).join("") + `</div>`;
  if (!list.length) {
    html += (taskFilter === "Mine" && !myName)
      ? `<div class="empty"><div class="big">👤</div>Set <b>Your name</b> in Settings<br>to see tasks assigned to you.</div>`
      : `<div class="empty"><div class="big">☑️</div>No ${taskFilter.toLowerCase()} tasks.</div>`;
  } else {
    html += `<div class="card">` + list.map(taskRowHTML).join("") + `</div>`;
  }
  $main.innerHTML = html;
  $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { taskFilter = b.dataset.filter; render(); });
  bindTaskRows();
}

/* ============ Working Study List (spreadsheet view) ============ */
let worklistShowClosed = false;
let worklistSort = { key: null, dir: 1 };
let worklistSearchQuery = "";
function renderWorkingList() {
  $title.textContent = "Working Study List";
  let studies = state.studies.slice();
  if (!worklistShowClosed) studies = studies.filter(isActive);
  if (worklistSearchQuery) studies = studies.filter(s => studyMatchesSearch(s, worklistSearchQuery));

  const sortKeyFns = {
    irb: s => (s.irb || "").toLowerCase(),
    irbStatus: s => (s.irbStatus || "").toLowerCase(),
    enrollment: s => { const cur = parseInt(s.enrollCurrent, 10); return isNaN(cur) ? -1 : cur; },
    title: s => (s.title || "").toLowerCase(),
    nickname: s => (s.nickname || s.title || "").toLowerCase(),
    design: s => (s.design || "").toLowerCase(),
    phase: s => PHASES.indexOf(s.phase),
    steps: s => state.tasks.filter(t => t.studyId === s.id && !t.done).length,
  };

  if (worklistSort.key && sortKeyFns[worklistSort.key]) {
    const fn = sortKeyFns[worklistSort.key];
    studies.sort((a, b) => {
      const va = fn(a), vb = fn(b);
      const cmp = typeof va === "number" && typeof vb === "number" ? va - vb : String(va).localeCompare(String(vb));
      return cmp * worklistSort.dir;
    });
  } else {
    // Default: active studies first, then by workflow phase order, then by nickname/title.
    studies.sort((a, b) =>
      (isActive(a) ? 0 : 1) - (isActive(b) ? 0 : 1) ||
      PHASES.indexOf(a.phase) - PHASES.indexOf(b.phase) ||
      (a.nickname || a.title).localeCompare(b.nickname || b.title));
  }

  const cols = [
    { key: "irb", label: "ORA / IRB #" },
    { key: "irbStatus", label: "IRB Status" },
    { key: "enrollment", label: "Enrollment" },
    { key: "title", label: "IRB Study Name" },
    { key: "nickname", label: "Nickname" },
    { key: "design", label: "Design" },
    { key: "phase", label: "Study Status" },
    { key: "steps", label: "Next Steps" },
  ];
  let html = `<div class="seg">
      <button class="${!worklistShowClosed ? "active" : ""}" data-wl="active">Active</button>
      <button class="${worklistShowClosed ? "active" : ""}" data-wl="all">All</button>
    </div>`;
  html += searchBoxHTML("worklist-search", worklistSearchQuery, "Search by title, nickname, PI, or IRB #");

  if (!studies.length) {
    html += worklistSearchQuery
      ? `<div class="empty"><div class="big">🔍</div>No studies match "${esc(worklistSearchQuery)}".</div>`
      : `<div class="empty"><div class="big">▦</div>No ${worklistShowClosed ? "" : "active "}studies yet.<br>Tap <b>+</b> to add one.</div>`;
    $main.innerHTML = html;
    $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { worklistShowClosed = b.dataset.wl === "all"; render(); });
    bindSearchBox("worklist-search", (v) => { worklistSearchQuery = v; });
    return;
  }

  const enrollCell = (s) => {
    const hasAny = (s.enrollCurrent !== "" && s.enrollCurrent != null) || (s.enrollTarget !== "" && s.enrollTarget != null);
    if (!hasAny) return `<span style="color:var(--text2)">—</span>`;
    const cur = (s.enrollCurrent === "" || s.enrollCurrent == null) ? "—" : s.enrollCurrent;
    const tgt = (s.enrollTarget === "" || s.enrollTarget == null) ? "—" : s.enrollTarget;
    return `${esc(String(cur))} / ${esc(String(tgt))}`;
  };
  const stepsCell = (s) => {
    const open = state.tasks.filter(t => t.studyId === s.id && !t.done)
      .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    if (!open.length) return `<span class="none">No open tasks</span>`;
    return `<ul>` + open.slice(0, 5).map(t =>
      `<li>${esc(t.title)}${t.due ? ` <span class="${dueClass(t.due)}" style="font-size:11px">(${fmtDate(t.due)})</span>` : ""}</li>`).join("")
      + (open.length > 5 ? `<li class="none">+${open.length - 5} more</li>` : "") + `</ul>`;
  };

  const rows = studies.map(s => `
    <tr data-open-study="${s.id}">
      <td>${s.irb ? esc(s.irb) : `<span style="color:var(--text2)">—</span>`}</td>
      <td><span class="wl-pill" style="background:${IRB_STATUS_COLORS[s.irbStatus] || "var(--text2)"}">${esc(s.irbStatus || "—")}</span></td>
      <td>${enrollCell(s)}</td>
      <td class="wl-title">${esc(s.title)}</td>
      <td class="wl-name">${esc(s.nickname || "—")}</td>
      <td><span class="badge outline" style="font-size:11px">${esc(DESIGN_SHORT[s.design] || "—")}</span></td>
      <td><span class="wl-pill" style="background:${PHASE_COLORS[s.phase] || "var(--text2)"}">${esc(s.phase)}</span></td>
      <td class="wl-steps">${stepsCell(s)}</td>
    </tr>`).join("");

  const sortArrow = (key) => worklistSort.key === key ? (worklistSort.dir === 1 ? " ▲" : " ▼") : "";
  html += `<div class="wl-wrap"><table class="wl">
      <thead><tr>${cols.map(c => `<th data-sort="${c.key}" style="cursor:pointer;user-select:none;white-space:nowrap">${esc(c.label)}${sortArrow(c.key)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-size:12px;color:var(--text2);line-height:1.5;margin:0 2px 8px 2px">Swipe sideways to see all columns. Tap a column header to sort, tap a row to open the study. Next steps are the study's open tasks (soonest due first).</div>`;

  $main.innerHTML = html;
  $main.querySelectorAll(".seg button").forEach(b => b.onclick = () => { worklistShowClosed = b.dataset.wl === "all"; render(); });
  bindSearchBox("worklist-search", (v) => { worklistSearchQuery = v; });
  $main.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    const key = th.dataset.sort;
    if (worklistSort.key === key) worklistSort.dir *= -1;
    else { worklistSort.key = key; worklistSort.dir = 1; }
    render();
  });
  $main.querySelectorAll("[data-open-study]").forEach(el => el.onclick = () => {
    openStudy(el.dataset.openStudy); tab = "studies"; render();
  });
}

  });

    if (m) openMeetingForm(m);
  });

  $main.querySelectorAll("[data-meeting-hide]").forEach(el => el.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    if (blockOfflineEdit("Hiding a deadline")) return;
    const m = state.meetings.find(x => x.id === el.dataset.meetingHide);
    if (!m) return;
    m.hidden = !m.hidden;
    upsertMeeting(m);
    toast(m.hidden ? "Hidden from the dashboard" : "Deadline unhidden");
  });
  document.getElementById("add-meeting-btn").onclick = () => openMeetingForm(null);
  document.getElementById("roster-add").onclick = () => {
    const n = document.getElementById("roster-name").value.trim();
    if (!n) return;
    if (state.roster.some(x => x.toLowerCase() === n.toLowerCase())) { toast("Already on the team"); return; }
    state.roster.push(n); state.roster.sort();
    saveLocal(); pushRoster(); render(); toast(n + " added");
  };
  $main.querySelectorAll("[data-roster-del]").forEach(b => b.onclick = () => {
    state.roster = state.roster.filter(x => x !== b.dataset.rosterDel);
    saveLocal(); pushRoster(); render();
  });

  document.getElementById("export-btn").onclick = () => {
    const files = {};
    Object.keys(localStorage).filter(k => k.startsWith("rt-file-")).forEach(k => { files[k.slice(8)] = localStorage.getItem(k); });
    const blob = new Blob([JSON.stringify(Object.assign({}, state, { files }), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "research-tracker-backup-" + todayStr() + ".json";
    a.click();
    toast("Backup downloaded");
  };
  document.getElementById("import-btn").onclick = () => document.getElementById("import-file").click();
  document.getElementById("import-file").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.studies) || !Array.isArray(data.tasks)) throw new Error("bad format");
        const files = data.files || {}; delete data.files;
        if (data.mergeMode === "add") {
          // Additive import: upsert by id, keep everything else (incl. deadline board) intact
          const upsert = (arr, item) => { const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); };
          (data.studies || []).forEach(s => upsert(state.studies, s));
          (data.tasks || []).forEach(t => upsert(state.tasks, t));
          (data.meetings || []).forEach(m => upsert(state.meetings, m));
          (data.roster || []).forEach(n => { if (!state.roster.some(x => x.toLowerCase() === n.toLowerCase())) state.roster.push(n); });
          state.roster.sort();
          // Resolve study→deadline links by stable meeting key (ids differ per device)
          (data.studies || []).forEach(s => {
            if (Array.isArray(s.linkKeys)) {
              s.linkKeys.forEach(k => {
                const m = state.meetings.find(x => x.key === k);
                if (m) { m.studyIds = m.studyIds || []; if (!m.studyIds.includes(s.id)) m.studyIds.push(s.id); }
              });
              delete s.linkKeys;
            }
          });
        } else {
          state = Object.assign({ studies: [], tasks: [], roster: [], meetings: [], teamNotes: [], userPrefs: [], profiles: [] }, data);
        }
        migrate(); saveLocal();
        Object.entries(files).forEach(([id, c]) => { try { localStorage.setItem("rt-file-" + id, c); } catch (e2) {} });
        state.studies.forEach(s => pushItem("study", s));
        state.tasks.forEach(t => pushItem("task", t));
        state.meetings.forEach(m => pushItem("meeting", m));
        pushRoster();
        render(); toast(data.mergeMode === "add" ? "Studies imported" : "Data imported");
      } catch (err) { toast("Invalid import file"); }
    };
    r.readAsText(f);
  };
  document.getElementById("sample-btn").onclick = () => {
    if (state.studies.length && !confirm("Add sample data alongside your existing data?")) return;
    loadSample(); toast("Sample data loaded");
  };
  document.getElementById("wipe-btn").onclick = () => {
    if (!confirm("Erase ALL studies, tasks, and files on this device?")) return;
    if (sb && !confirm("Also note: this only clears THIS device, not the team workspace. Continue?")) return;
    Object.keys(localStorage).filter(k => k.startsWith("rt-file-")).forEach(k => localStorage.removeItem(k));
    state = { studies: [], tasks: [], roster: [], meetings: [] }; saveLocal(); render(); toast("All data erased");
  };
}

/* ============ Forms (bottom sheets) ============ */
function openSheet(title, bodyHTML, onSave) {
  // Remove any prior sheet instantly — a delayed (animated) removal would leave
  // duplicate element IDs and route the Save button to the wrong handler.
  document.querySelectorAll("#sheet-bd, #sheet").forEach(el => el.remove());
  const bd = document.createElement("div"); bd.className = "sheet-backdrop"; bd.id = "sheet-bd";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.id = "sheet";
  sh.innerHTML = `
    <div class="sheet-head">
      <button id="sheet-cancel">Cancel</button>
      <h2>${esc(title)}</h2>
      <button id="sheet-save" style="font-weight:800">Save</button>
    </div>
    <div class="sheet-body">${bodyHTML}</div>`;
  document.body.appendChild(bd); document.body.appendChild(sh);
  requestAnimationFrame(() => { bd.classList.add("show"); sh.classList.add("show"); });
  bd.onclick = closeSheet;
  document.getElementById("sheet-cancel").onclick = closeSheet;
  document.getElementById("sheet-save").onclick = () => { if (onSave() !== false) closeSheet(); };
}
function closeSheet() {
  const bd = document.getElementById("sheet-bd"), sh = document.getElementById("sheet");
  if (bd) { bd.classList.remove("show"); setTimeout(() => bd.remove(), 260); }
  if (sh) { sh.classList.remove("show"); setTimeout(() => sh.remove(), 320); }
  editingRef = null;
}
function selectHTML(id, options, selected) {
  return `<select id="${id}">` + options.map(o => `<option ${o === selected ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
}

      if (!title) { toast("Title is required"); return false; }
      if (existing && isStale("study", s.id, editingRef && editingRef.baseline)) {
        if (!confirmOverwriteOrReload("study", s.id)) return false;
      }
      Object.assign(s, {
        title,
        nickname: document.getElementById("f-nickname").value.trim(),
        pi: document.getElementById("f-pi").value.trim(),
        team: [...document.querySelectorAll(".f-team-pick")].filter(c => c.checked).map(c => c.dataset.name),

          amount: document.getElementById("f-grant-amount").value.trim(),
          source: document.getElementById("f-grant-source").value.trim(),
          awardDate: document.getElementById("f-grant-award-date").value,
          balance: document.getElementById("f-grant-balance").value.trim(),
          expirationDate: document.getElementById("f-grant-expiration").value,
          balanceUpdatedDate: document.getElementById("f-grant-balance-updated").value
        }
      });

      upsertStudy(s);

    });
  bindSheetSearch("f-team-search", "#f-team-list .team-row", "f-team-empty");
  // Adding someone new: append them ticked, add to the roster, and clear the search so the new
  // row is definitely visible rather than filtered out by a stale query.
  const addTeamMember = () => {
    const input = document.getElementById("f-team-new");
    const name = canonName(input.value);
    if (!name) return;
    if (!state.roster.includes(name)) { state.roster.push(name); state.roster.sort((a, b) => a.localeCompare(b)); pushRoster(); }
    const picked = [...document.querySelectorAll(".f-team-pick")].filter(c => c.checked).map(c => c.dataset.name);
    if (!picked.includes(name)) picked.push(name);
    document.getElementById("f-team-list").innerHTML = teamPickerRowsHTML(picked);
    const search = document.getElementById("f-team-search");
    search.value = "";
    search.dispatchEvent(new Event("input"));
    input.value = "";
    toast(name + " added");
  };
  document.getElementById("f-team-add").onclick = addTeamMember;
  document.getElementById("f-team-new").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addTeamMember(); }
  });
  // When design changes, swap the phase list to that track
  document.getElementById("f-design").onchange = (e) => {
    const phases = TRACK_PHASES[e.target.value];
    const phaseSel = document.getElementById("f-phase");
    const current = phaseSel.value;
    phaseSel.innerHTML = phases.map(p => `<option ${p === current ? "selected" : ""}>${esc(p)}</option>`).join("");
    if (!phases.includes(current)) phaseSel.value = phases[0];
    togglePhaseRows();
  };
  const togglePhaseRows = () => {
    const phase = document.getElementById("f-phase").value;
    document.getElementById("journal-row").style.display = SUBMITTED_PHASES.includes(phase) ? "flex" : "none";
    document.getElementById("revisions-row").style.display = phase === "Revisions Required" ? "flex" : "none";
  };
  document.getElementById("f-phase").onchange = togglePhaseRows;
  document.getElementById("f-grant-enabled").onchange = (e) => {
    document.getElementById("grant-row").style.display = e.target.checked ? "flex" : "none";
  };
}

function openTaskForm(existing, presetStudyId) {
  if (blockOfflineEdit(existing ? "Editing a task" : "Adding a task")) return;
  const t = existing || { id: uid(), title: "", studyId: presetStudyId || "", due: "", assignees: [], notes: "", done: false };
  editingRef = existing ? { kind: "task", id: t.id, baseline: remoteMeta[t.id] ? remoteMeta[t.id].updated_at : null } : null;
  const studyOpts = [`<option value="">(none)</option>`]
    .concat(state.studies.map(s => `<option value="${s.id}" ${s.id === t.studyId ? "selected" : ""}>${esc(s.title)}</option>`)).join("");
  openSheet(existing ? "Edit Task" : "New Task", `
    <div class="fgroup">
      <div class="frow"><label>Task</label><input id="f-ttitle" placeholder="What needs doing?" value="${esc(t.title)}"></div>
      <div class="frow"><label>Study</label><select id="f-tstudy">${studyOpts}</select></div>

    </div>
    <datalist id="dl-people">${state.roster.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="fgroup">
      <div class="frow"><textarea id="f-tnotes" placeholder="Notes…">${esc(t.notes || "")}</textarea></div>
    </div>
    ${existing && t.studyId && studyById(t.studyId) ? `<button type="button" class="btn secondary" id="f-tgoto-study">Open Study: ${esc(studyById(t.studyId).nickname || studyById(t.studyId).title)} ›</button>` : ""}
    ${existing && t.linkedMeetingId && state.meetings.find(x => x.id === t.linkedMeetingId) ? `<button type="button" class="btn secondary" id="f-tgoto-meeting">View Deadline: ${esc(state.meetings.find(x => x.id === t.linkedMeetingId).name)} ›</button>` : ""}
    ${existing ? `<button class="btn danger" id="f-tdel">Delete Task</button>` : ""}`,
    () => {
      const title = document.getElementById("f-ttitle").value.trim();
      if (!title) { toast("Task name is required"); return false; }
      if (existing && isStale("task", t.id, editingRef && editingRef.baseline)) {
        if (!confirmOverwriteOrReload("task", t.id)) return false;
      }
      Object.assign(t, {
        title,
        studyId: document.getElementById("f-tstudy").value,
        due: document.getElementById("f-tdue").value,
        assignees: document.getElementById("f-tassignee").value.split(",").map(a => a.trim()).filter(Boolean),
        notes: document.getElementById("f-tnotes").value.trim()
      });
      upsertTask(t);
      toast(existing ? "Task updated" : "Task added");
    });
  const del = document.getElementById("f-tdel");
  if (del) del.onclick = () => { if (blockOfflineEdit("Deleting a task")) return; removeTask(t.id); closeSheet(); toast("Task deleted"); };
  const gotoStudy = document.getElementById("f-tgoto-study");
  if (gotoStudy) gotoStudy.onclick = () => { openStudy(t.studyId); tab = "studies"; closeSheet(); render(); };
  const gotoMeeting = document.getElementById("f-tgoto-meeting");
  if (gotoMeeting) gotoMeeting.onclick = () => {
    const m = state.meetings.find(x => x.id === t.linkedMeetingId);
    if (m) openMeetingForm(m);
  };
}

// Merge feed entries into state.meetings. A feed entry updates the matching meeting only when its
// verifiedOn is newer than what we last applied, so manual edits between refreshes are preserved
// until a genuinely newer verified value arrives.
function applyFeedEntries(entries, fromNetwork) {
  let changed = [];
  (entries || []).forEach(e => {
    if (!e.key) return;
    let m = state.meetings.find(x => x.key === e.key)
         || state.meetings.find(x => !x.key && x.society === e.society && x.name === e.name);
    if (!m) {
      m = { id: uid(), key: e.key, society: e.society, name: e.name, type: e.type || "abstract", loiDeadline: e.loiDeadline || "", deadline: e.deadline || "", dates: e.dates || "", location: e.location || "", link: e.link || "", aim: e.aim || "", criteria: e.criteria || "", funded: Array.isArray(e.funded) ? e.funded.slice() : [], studyIds: [], unconfirmed: !!e.unconfirmed, verifiedOn: e.verifiedOn || "" };
      state.meetings.push(m); changed.push(m);
    } else if (!m.verifiedOn || (e.verifiedOn || "") > m.verifiedOn) {
      // feed-sourced fields refresh; studyIds (user associations) are preserved
      m.key = e.key; m.type = e.type || m.type || "abstract";
      if (e.name) m.name = e.name;
      m.loiDeadline = e.loiDeadline || ""; m.deadline = e.deadline || ""; m.dates = e.dates || ""; m.location = e.location || "";
      m.link = e.link || ""; m.unconfirmed = !!e.unconfirmed; m.verifiedOn = e.verifiedOn || "";
      if (e.aim != null) m.aim = e.aim;
      if (e.criteria != null) m.criteria = e.criteria;
      if (Array.isArray(e.funded)) m.funded = e.funded.slice();
      changed.push(m);
    }
  });
  if (changed.length) { saveLocal(); changed.forEach(m => pushItem("meeting", m)); render(); }
  return changed.length;
}

// Pull the hosted deadlines.json (updated biweekly) so every team device gets refreshed dates.
async function fetchDeadlineFeed() {
  try {
    const res = await fetch("./deadlines.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const entries = Array.isArray(data) ? data : data.meetings;
    const n = applyFeedEntries(entries, true);
    if (n) toast("Deadlines updated");
  } catch (e) { /* offline or opened as a local file — seeds already cover it */ }
}

// Desktop-only collapsible + resizable dashboard sidebar
const SIDEBAR_MIN_WIDTH = 220, SIDEBAR_MAX_WIDTH = 560;
let sidebarCollapsed = localStorage.getItem("rt-sidebar-collapsed") === "1";
let sidebarWidth = parseInt(localStorage.getItem("rt-sidebar-width"), 10);
if (!sidebarWidth || isNaN(sidebarWidth)) sidebarWidth = 320;
sidebarWidth = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, sidebarWidth));
function applySidebarWidth() {
  if (!$sidebar) return;
  // Collapsed width is owned by CSS (.sidebar.collapsed); clear any inline override so it applies.
  $sidebar.style.width = sidebarCollapsed ? "" : sidebarWidth + "px";
}
function applySidebarCollapsed() {
  if (!$sidebar) return;
  $sidebar.classList.toggle("collapsed", sidebarCollapsed);
  if ($sidebarToggle) $sidebarToggle.textContent = sidebarCollapsed ? "›" : "‹";
  applySidebarWidth();
}
if ($sidebarToggle) {
  $sidebarToggle.onclick = () => {
    sidebarCollapsed = !sidebarCollapsed;
    localStorage.setItem("rt-sidebar-collapsed", sidebarCollapsed ? "1" : "0");
    applySidebarCollapsed();
  };
}
applySidebarCollapsed();
desktopMQ.addEventListener("change", () => renderSidebar());

// Drag the sidebar/main divider to resize the dashboard panel
if ($sidebarResizer) {
  let dragging = false;
  $sidebarResizer.addEventListener("pointerdown", (e) => {
    if (sidebarCollapsed) return;
    dragging = true;
    $sidebarResizer.setPointerCapture(e.pointerId);
    $sidebarResizer.classList.add("dragging");
    document.body.style.userSelect = "none";
  });
  $sidebarResizer.addEventListener("pointermove", (e) => {
    if (!dragging || !$sidebar) return;
    const rect = $sidebar.getBoundingClientRect();
    sidebarWidth = Math.min(SIDEBAR_MAX_WIDTH, Math.max(SIDEBAR_MIN_WIDTH, e.clientX - rect.left));
    $sidebar.style.width = sidebarWidth + "px";
  });
  const endSidebarDrag = () => {
    if (!dragging) return;
    dragging = false;
    $sidebarResizer.classList.remove("dragging");
    document.body.style.userSelect = "";
    localStorage.setItem("rt-sidebar-width", String(Math.round(sidebarWidth)));
  };
  $sidebarResizer.addEventListener("pointerup", endSidebarDrag);
  $sidebarResizer.addEventListener("pointercancel", endSidebarDrag);
}

// Login screen handlers — bound once; the login screen markup is static (not re-rendered by
// the main render() loop), unlike the rest of the app.
function bindLoginScreen() {
  const submitBtn = document.getElementById("login-submit");
  const doSignIn = async () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    if (!email || !password) { setLoginMsg("Enter your email and password."); return; }
    setLoginMsg("");
    submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      // Success is handled by handleAuthChange() via the auth-state listener.
    } catch (e) {
      setLoginMsg(e.message || "Sign in failed.");
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = "Sign In";
    }
  };
  submitBtn.onclick = doSignIn;
  document.getElementById("login-password").addEventListener("keydown", (e) => { if (e.key === "Enter") doSignIn(); });
  document.getElementById("login-forgot").onclick = async () => {
    if (!sb) { setLoginMsg("Still connecting — try again in a moment."); return; }
    const email = document.getElementById("login-email").value.trim();
    if (!email) { setLoginMsg("Enter your email above first, then tap Forgot password."); return; }
    setLoginMsg("");
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      if (error) throw error;
      setLoginMsg("Check your email for a password reset link.", "info");
    } catch (e) {
      setLoginMsg(e.message || "Could not send reset email.");
    }
  };
  document.getElementById("recovery-submit").onclick = async () => {
    if (!sb) return;
    const password = document.getElementById("recovery-password").value;
    if (!password || password.length < 6) { setLoginMsg("Password must be at least 6 characters."); return; }
    setLoginMsg("");
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      document.getElementById("login-recovery").style.display = "none";
      document.getElementById("login-fields").style.display = "block";
      toast("Password updated");
    } catch (e) {
      setLoginMsg(e.message || "Could not update password.");
    }
  };
}
